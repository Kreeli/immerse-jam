name: Deploy introduction website

on:
  push:
    branches: [main]
    paths:
      - 'docs/site/**'
      - '.github/workflows/pages.yml'
      - 'scripts/prepare-website-downloads.cjs'
      - 'scripts/test-website-demo.cjs'
      - 'scripts/preview-website.cjs'
      - 'web-demo/**'
      - 'src/**'
      - 'shared/**'
      - 'package.json'
      - 'package-lock.json'
  release:
    types: [published, edited, deleted]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh-after-release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Refresh website from the deployment branch
        run: gh workflow run pages.yml --ref main --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'release'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Refresh direct download links
        run: node scripts/prepare-website-downloads.cjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Install frontend dependencies
        run: npm ci --ignore-scripts
      - name: Build interactive PC demo
        run: node node_modules/vite/bin/vite.js build --config web-demo/vite.config.mjs
      - name: Install demo test browser
        run: npx playwright install --with-deps chromium
      - name: Verify interactive demo
        run: node scripts/test-website-demo.cjs
      - name: Upload verified website
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
