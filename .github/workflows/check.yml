name: Source checks
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    env:
      TEST_RUNTIME_DIR: .runtime/e2e-runtime
      # ffmpeg-static downloads its binary from the GitHub release CDN, which intermittently
      # returns 504 from Azure runners. npmmirror mirrors the same b6.1.1 layout.
      FFMPEG_BINARIES_URL: https://cdn.npmmirror.com/binaries/ffmpeg-static
      # Electron postinstall hits the same CDN flakiness; point @electron/get at the mirror.
      ELECTRON_MIRROR: https://cdn.npmmirror.com/binaries/electron/
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # Retry npm ci so a single 504 from the ffmpeg-static release CDN does not fail the job.
      - name: Install dependencies
        run: |
          $i = 0
          while ($true) {
            npm ci
            if ($LASTEXITCODE -eq 0) { break }
            $i++
            if ($i -ge 3) { exit $LASTEXITCODE }
            Write-Host "npm ci attempt $i failed; retrying"
          }
      - run: npm run check
      - name: Keep generated and private materials out of source
        run: node scripts/audit-source.cjs
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npx playwright install chromium
      - run: node scripts/ci-ui-check.cjs
      - name: Electron system proxy
        run: node scripts/network-check.cjs
      - name: Electron playback controls
        run: node scripts/controls-check.cjs
      - name: Electron chords and interactions
        run: node scripts/interaction-check.cjs
      - run: npx vite build --mode android
      - run: node scripts/android-shared-ui-check.cjs
      - name: Save failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: source-check-failure-screenshots
          path: test-output/*.png
          if-no-files-found: ignore
          retention-days: 7
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-test.txt
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r backend/requirements-test.txt
      - run: node scripts/test-backend.cjs
