<title>Immerse Jam 界面原型</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout concept: "夜间排练室" — a dark rehearsal-room shell (nav rail · stage · console · transport).
   Stems are neon strings: each part owns one colour everywhere (wave, chip, fader, meter).
   The master waveform is drawn as stacked stems, so muting a part visibly removes it from the mix. */
:root {
  /* ---------- surfaces (dark-first) ---------- */
  --ground: #0d0c11;
  --surface-1: #14131a;
  --surface-2: #1b1a22;
  --surface-3: #24222d;
  --surface-4: #2e2b38;
  --line: #2a2833;
  --line-strong: #3b3847;
  --text: #eeecf3;
  --text-2: #aba7b9;
  --text-3: #75718a;
  --scrim: rgba(6, 5, 9, 0.66);
  --playhead: #ffffff;
  --shadow-pop: 0 18px 48px rgba(0, 0, 0, 0.5), 0 2px 8px rgba(0, 0, 0, 0.35);
  --shadow-sheet: 0 -12px 40px rgba(0, 0, 0, 0.45);
  /* ---------- accent (user-selectable: rose / ocean / pine / violet) ---------- */
  --accent: #ff5c7a;
  --accent-strong: #ff7d95;
  --accent-ink: #1d0a10;
  --accent-soft: rgba(255, 92, 122, 0.14);
  --accent-line: rgba(255, 92, 122, 0.42);
  /* ---------- stems: neon strings from the app icon ---------- */
  --stem-vocals: #ff5470;
  --stem-drums: #b77bff;
  --stem-bass: #45adff;
  --stem-piano: #3fdc92;
  --stem-guitar: #ffa043;
  --stem-other: #9a95ad;
  --stem-lead: #ffc15a;
  --stem-rhythm: #ff7f3a;
  --stem-backing: #ff92b4;
  --stem-take: #efe7d2;
  /* ---------- semantic ---------- */
  --ok: #45d39a;
  --warn: #ffb547;
  --danger: #ff5d5d;
  --rec: #ff3b4f;
  --info: #6cb8ff;
  /* ---------- type ---------- */
  --font-display: "Bricolage Grotesque", "Noto Sans SC", "HarmonyOS Sans SC", "PingFang SC", "Microsoft YaHei UI", sans-serif;
  --font-ui: "Noto Sans SC", "HarmonyOS Sans SC", "PingFang SC", "Microsoft YaHei UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", "Cascadia Mono", Consolas, ui-monospace, monospace;
  --fs-micro: 11px;
  --fs-cap: 12px;
  --fs-ui: 13px;
  --fs-body: 14px;
  --fs-title-s: 16px;
  --fs-title: 20px;
  --fs-display: 30px;
  /* ---------- shape & rhythm ---------- */
  --r-xs: 4px;
  --r-s: 7px;
  --r-m: 10px;
  --r-l: 14px;
  --r-xl: 20px;
  --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
  --t-fast: 120ms;
  --t-med: 200ms;
  --t-slow: 300ms;
  color-scheme: dark;
}
:root[data-accent="ocean"] { --accent: #3fa7ff; --accent-strong: #6dbcff; --accent-ink: #04121f; --accent-soft: rgba(63,167,255,.14); --accent-line: rgba(63,167,255,.42); }
:root[data-accent="pine"] { --accent: #34d399; --accent-strong: #5fe0b0; --accent-ink: #03170f; --accent-soft: rgba(52,211,153,.14); --accent-line: rgba(52,211,153,.42); }
:root[data-accent="violet"] { --accent: #a78bfa; --accent-strong: #bfa9ff; --accent-ink: #120a24; --accent-soft: rgba(167,139,250,.16); --accent-line: rgba(167,139,250,.45); }

@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --ground: #eeedf2; --surface-1: #fbfbfd; --surface-2: #ffffff; --surface-3: #f0eff5; --surface-4: #e5e3ec;
    --line: #e1dfe8; --line-strong: #cbc8d6; --text: #17151d; --text-2: #55516a; --text-3: #85819a;
    --scrim: rgba(30, 27, 40, 0.38); --playhead: #17151d;
    --shadow-pop: 0 18px 48px rgba(40, 30, 70, 0.16), 0 2px 8px rgba(40, 30, 70, 0.1);
    --shadow-sheet: 0 -10px 36px rgba(40, 30, 70, 0.14);
    --accent: #e23d62; --accent-strong: #c92a50; --accent-ink: #ffffff; --accent-soft: rgba(226,61,98,.1); --accent-line: rgba(226,61,98,.38);
    --stem-vocals: #e2334f; --stem-drums: #8a4fe0; --stem-bass: #1f84d8; --stem-piano: #13a465; --stem-guitar: #e27518;
    --stem-other: #77728c; --stem-lead: #d9951a; --stem-rhythm: #e05a14; --stem-backing: #e0628c; --stem-take: #3a3448;
    --ok: #129a63; --warn: #c27c06; --danger: #d63434; --rec: #e0263a; --info: #1f7fd0;
    color-scheme: light;
  }
  :root:not([data-theme="dark"])[data-accent="ocean"] { --accent: #1677d2; --accent-strong: #0f63b2; --accent-ink: #fff; --accent-soft: rgba(22,119,210,.1); --accent-line: rgba(22,119,210,.38); }
  :root:not([data-theme="dark"])[data-accent="pine"] { --accent: #0e9466; --accent-strong: #0a7a54; --accent-ink: #fff; --accent-soft: rgba(14,148,102,.1); --accent-line: rgba(14,148,102,.38); }
  :root:not([data-theme="dark"])[data-accent="violet"] { --accent: #7c4fe0; --accent-strong: #6638cc; --accent-ink: #fff; --accent-soft: rgba(124,79,224,.1); --accent-line: rgba(124,79,224,.38); }
}
:root[data-theme="light"] {
  --ground: #eeedf2; --surface-1: #fbfbfd; --surface-2: #ffffff; --surface-3: #f0eff5; --surface-4: #e5e3ec;
  --line: #e1dfe8; --line-strong: #cbc8d6; --text: #17151d; --text-2: #55516a; --text-3: #85819a;
  --scrim: rgba(30, 27, 40, 0.38); --playhead: #17151d;
  --shadow-pop: 0 18px 48px rgba(40, 30, 70, 0.16), 0 2px 8px rgba(40, 30, 70, 0.1);
  --shadow-sheet: 0 -10px 36px rgba(40, 30, 70, 0.14);
  --accent: #e23d62; --accent-strong: #c92a50; --accent-ink: #ffffff; --accent-soft: rgba(226,61,98,.1); --accent-line: rgba(226,61,98,.38);
  --stem-vocals: #e2334f; --stem-drums: #8a4fe0; --stem-bass: #1f84d8; --stem-piano: #13a465; --stem-guitar: #e27518;
  --stem-other: #77728c; --stem-lead: #d9951a; --stem-rhythm: #e05a14; --stem-backing: #e0628c; --stem-take: #3a3448;
  --ok: #129a63; --warn: #c27c06; --danger: #d63434; --rec: #e0263a; --info: #1f7fd0;
  color-scheme: light;
}
:root[data-theme="light"][data-accent="ocean"] { --accent: #1677d2; --accent-strong: #0f63b2; --accent-ink: #fff; --accent-soft: rgba(22,119,210,.1); --accent-line: rgba(22,119,210,.38); }
:root[data-theme="light"][data-accent="pine"] { --accent: #0e9466; --accent-strong: #0a7a54; --accent-ink: #fff; --accent-soft: rgba(14,148,102,.1); --accent-line: rgba(14,148,102,.38); }
:root[data-theme="light"][data-accent="violet"] { --accent: #7c4fe0; --accent-strong: #6638cc; --accent-ink: #fff; --accent-soft: rgba(124,79,224,.1); --accent-line: rgba(124,79,224,.38); }

/* ================= base ================= */
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--ground); color: var(--text);
  font: 400 var(--fs-ui)/1.5 var(--font-ui);
  -webkit-font-smoothing: antialiased; overflow: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
button:disabled { cursor: not-allowed; opacity: .45; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--r-s); }
.mono, .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 700; }
p { margin: 0; }
.ico { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ico.s { width: 15px; height: 15px; }
.ico.l { width: 22px; height: 22px; }
.ico.fill { fill: currentColor; stroke: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--surface-4); border-radius: 10px; border: 3px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-track { background: transparent; }

/* ================= prototype chrome (not part of the product) ================= */
.proto {
  height: 48px; display: flex; align-items: center; gap: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--surface-1); border-bottom: 1px solid var(--line); position: relative; z-index: 60;
}
.proto-name { display: flex; align-items: center; gap: 10px; min-width: 0; }
.proto-name b { font: 650 15px/1 var(--font-display); letter-spacing: -0.01em; white-space: nowrap; }
.proto-name span { color: var(--text-3); font-size: var(--fs-cap); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.proto-tools { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.swatches { display: flex; gap: 6px; }
.swatch { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--surface-1); box-shadow: 0 0 0 1px var(--line-strong); }
.swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--text); }
.stage-wrap { height: calc(100% - 48px); position: relative; }
body.narrow .proto-name span, body.narrow .proto .hide-narrow { display: none; }

/* ================= shared controls ================= */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 34px; padding: 0 14px;
  border-radius: var(--r-s); font-weight: 500; white-space: nowrap; color: var(--text);
  background: var(--surface-3); border: 1px solid var(--line-strong);
  transition: background var(--t-fast), border-color var(--t-fast), color var(--t-fast), transform var(--t-fast);
}
.btn:hover:not(:disabled) { background: var(--surface-4); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: transparent; color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover:not(:disabled) { background: var(--accent-strong); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--text-2); }
.btn.ghost:hover:not(:disabled) { background: var(--surface-3); color: var(--text); }
.btn.quiet { background: transparent; border-color: var(--line-strong); }
.btn.danger { background: var(--danger); color: #fff; border-color: transparent; }
.btn.danger-ghost { color: var(--danger); background: transparent; border-color: color-mix(in srgb, var(--danger) 40%, transparent); }
.btn.sm { height: 28px; padding: 0 10px; font-size: var(--fs-cap); gap: 5px; }
.btn.lg { height: 42px; padding: 0 20px; font-size: var(--fs-body); }
.btn.block { width: 100%; }
.icon-btn {
  width: 34px; height: 34px; display: inline-grid; place-items: center; border-radius: var(--r-s); color: var(--text-2);
  transition: background var(--t-fast), color var(--t-fast);
}
.icon-btn:hover:not(:disabled) { background: var(--surface-3); color: var(--text); }
.icon-btn.sm { width: 28px; height: 28px; }
.icon-btn[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.chip {
  display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px; border-radius: 999px;
  font-size: var(--fs-cap); color: var(--text-2); background: var(--surface-3); white-space: nowrap;
}
.chip.ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 13%, transparent); }
.chip.warn { color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, transparent); }
.chip.danger { color: var(--danger); background: color-mix(in srgb, var(--danger) 13%, transparent); }
.chip.accent { color: var(--accent); background: var(--accent-soft); }
.chip.rec { color: var(--rec); background: color-mix(in srgb, var(--rec) 14%, transparent); }
.chip .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
button.chip:hover { background: var(--surface-4); color: var(--text); }
.seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: var(--r-m); background: var(--surface-1); border: 1px solid var(--line); }
.seg button {
  height: 28px; padding: 0 12px; border-radius: var(--r-s); color: var(--text-2); display: inline-flex; align-items: center; gap: 6px;
  font-weight: 500; white-space: nowrap; transition: background var(--t-fast), color var(--t-fast);
}
.seg button:hover { color: var(--text); }
.seg button[aria-pressed="true"], .seg button[aria-selected="true"] { background: var(--surface-4); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.25); }
.seg.accent button[aria-pressed="true"], .seg.accent button[aria-selected="true"] { background: var(--accent-soft); color: var(--accent); box-shadow: none; }
.seg.sm button { height: 24px; padding: 0 9px; font-size: var(--fs-cap); }
.field { display: grid; gap: 6px; }
.field > span, .label { font-size: var(--fs-cap); color: var(--text-3); font-weight: 500; }
.eyebrow { font-size: var(--fs-micro); letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-3); font-weight: 600; }
.input, .select {
  height: 34px; padding: 0 11px; border-radius: var(--r-s); background: var(--surface-1);
  border: 1px solid var(--line-strong); color: var(--text); width: 100%; min-width: 0;
}
.input:focus, .select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
textarea.input { height: auto; padding: 10px 11px; resize: vertical; line-height: 1.6; }
.search { position: relative; display: flex; align-items: center; }
.search .ico { position: absolute; left: 11px; color: var(--text-3); pointer-events: none; }
.search .input { padding-left: 36px; }
.toggle { position: relative; width: 36px; height: 20px; border-radius: 999px; background: var(--surface-4); flex: none; transition: background var(--t-med); }
.toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--text-2); transition: transform var(--t-med) var(--ease), background var(--t-med); }
.toggle[aria-checked="true"] { background: var(--accent); }
.toggle[aria-checked="true"]::after { transform: translateX(16px); background: var(--accent-ink); }
.check { width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid var(--line-strong); display: inline-grid; place-items: center; flex: none; background: var(--surface-1); }
.check[aria-checked="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.check[aria-checked="true"]::after { content: ""; width: 9px; height: 5px; border-left: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: translateY(-1px) rotate(-45deg); }
.radio { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--line-strong); flex: none; display: inline-grid; place-items: center; }
.radio[aria-checked="true"] { border-color: var(--accent); }
.radio[aria-checked="true"]::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }

/* range slider: track tint comes from --c (stem colour or accent) and --p (fill %) */
.range { -webkit-appearance: none; appearance: none; width: 100%; height: 20px; background: transparent; --c: var(--accent); --p: 50%; margin: 0; }
.range::-webkit-slider-runnable-track { height: 4px; border-radius: 4px; background: linear-gradient(90deg, var(--c) 0 var(--p), var(--surface-4) var(--p) 100%); }
.range::-moz-range-track { height: 4px; border-radius: 4px; background: linear-gradient(90deg, var(--c) 0 var(--p), var(--surface-4) var(--p) 100%); }
.range::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; margin-top: -5px; border-radius: 50%; background: var(--text); border: 3px solid var(--c); box-shadow: 0 1px 4px rgba(0,0,0,.4); transition: transform var(--t-fast); }
.range::-moz-range-thumb { width: 10px; height: 10px; border-radius: 50%; background: var(--text); border: 3px solid var(--c); }
.range:hover::-webkit-slider-thumb { transform: scale(1.15); }
.range.pan::-webkit-slider-runnable-track { background: linear-gradient(90deg, var(--surface-4) 0 calc(50% - 1px), var(--text-3) calc(50% - 1px) calc(50% + 1px), var(--surface-4) calc(50% + 1px)); }
.range.pan::-webkit-slider-thumb { width: 10px; height: 14px; border-radius: 3px; border: 0; background: var(--text-2); margin-top: -5px; }
.range:disabled { opacity: .4; }
.stem-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; box-shadow: 0 0 8px color-mix(in srgb, var(--c) 60%, transparent); }
.kbd { font: 500 11px/1 var(--font-mono); padding: 3px 6px; border-radius: 5px; background: var(--surface-3); border: 1px solid var(--line-strong); color: var(--text-2); }
.progress { height: 6px; border-radius: 6px; background: var(--surface-4); overflow: hidden; }
.progress > i { display: block; height: 100%; width: var(--p, 0%); background: var(--accent); border-radius: inherit; transition: width .3s linear; }
.progress.ok > i { background: var(--ok); }
.divider { height: 1px; background: var(--line); border: 0; margin: 0; }
.muted { color: var(--text-3); }
.dim { color: var(--text-2); }
.ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.row { display: flex; align-items: center; gap: 8px; min-width: 0; }
.row.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
.stack { display: grid; gap: 12px; }
.badge-count { font: 600 11px/1 var(--font-mono); padding: 3px 6px; border-radius: 999px; background: var(--surface-4); color: var(--text-2); }
.notice { display: flex; gap: 10px; padding: 10px 12px; border-radius: var(--r-m); background: var(--surface-1); border: 1px solid var(--line); color: var(--text-2); font-size: var(--fs-cap); line-height: 1.6; }
.notice .ico { color: var(--info); margin-top: 1px; }
.notice.warn .ico { color: var(--warn); }
.cover { flex: none; border-radius: var(--r-m); overflow: hidden; background: #0a090e; position: relative; }
.cover svg { display: block; width: 100%; height: 100%; }
</style>
<style>
/* ================= desktop shell ================= */
.app { height: 100%; display: grid; grid-template-columns: 236px minmax(0, 1fr); background: var(--ground); }
.app.rail { grid-template-columns: 68px minmax(0, 1fr); }
.nav { background: var(--surface-1); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.nav-brand { height: 64px; display: flex; align-items: center; gap: 10px; padding: 0 18px; flex: none; }
.brandmark { width: 30px; height: 30px; flex: none; border-radius: 9px; background: #09080d; display: grid; place-items: center; box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); }
.brandmark svg { width: 24px; height: 24px; }
.nav-brand b { font: 750 17px/1 var(--font-display); letter-spacing: -0.02em; }
.nav-brand b span { font-weight: 500; color: var(--text-2); }
.nav-scroll { flex: 1; overflow-y: auto; padding: 4px 10px 12px; display: grid; align-content: start; gap: 18px; }
.nav-group { display: grid; gap: 2px; }
.nav-group > .row { padding: 0 8px 4px; }
.nav-item {
  height: 36px; display: flex; align-items: center; gap: 10px; padding: 0 10px; border-radius: var(--r-s);
  color: var(--text-2); font-weight: 500; text-align: left; width: 100%; position: relative;
  transition: background var(--t-fast), color var(--t-fast);
}
.nav-item:hover { background: var(--surface-3); color: var(--text); }
.nav-item[aria-current="page"] { background: var(--surface-3); color: var(--text); }
.nav-item[aria-current="page"] .ico { color: var(--accent); }
.nav-item .badge-count { margin-left: auto; }
.nav-item.sub { height: 32px; font-weight: 400; font-size: var(--fs-ui); }
.nav-foot { padding: 12px 10px 14px; border-top: 1px solid var(--line); display: grid; gap: 6px; flex: none; }
.engine { display: flex; gap: 10px; align-items: center; padding: 9px 10px; border-radius: var(--r-m); background: var(--surface-2); border: 1px solid var(--line); text-align: left; width: 100%; }
.engine .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 4px color-mix(in srgb, var(--ok) 18%, transparent); flex: none; }
.engine b { display: block; font-size: var(--fs-cap); font-weight: 600; }
.engine small { display: block; font-size: var(--fs-micro); color: var(--text-3); }
.nav-mini { display: flex; gap: 2px; }
.nav-mini .btn { flex: 1; height: 30px; font-size: var(--fs-cap); padding: 0 6px; }
.donate { display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px 10px; border-radius: var(--r-s); color: var(--text-2); font-size: var(--fs-cap); }
.donate:hover { background: var(--surface-3); color: var(--text); }
.donate .ico { color: var(--accent); }
.ver { font: 500 10px/1 var(--font-mono); color: var(--text-3); letter-spacing: .12em; padding: 4px 10px 0; }
.app.rail .nav-brand b, .app.rail .nav-item span, .app.rail .nav-item .badge-count, .app.rail .nav-group > .row, .app.rail .engine div,
.app.rail .nav-mini, .app.rail .donate span, .app.rail .ver, .app.rail .folder-list { display: none; }
.app.rail .nav-item, .app.rail .donate { justify-content: center; padding: 0; }
.app.rail .nav-brand { justify-content: center; padding: 0; }
.app.rail .engine { justify-content: center; padding: 10px 0; }

.main { display: grid; grid-template-rows: minmax(0, 1fr) auto; min-width: 0; min-height: 0; position: relative; }
.content { min-height: 0; min-width: 0; position: relative; }
.page { height: 100%; overflow-y: auto; padding: 32px max(28px, 3vw) 40px; }
.page-inner { max-width: 1320px; margin: 0 auto; display: grid; gap: 24px; }
.page-head { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.page-head h1 { font: 650 var(--fs-display)/1.1 var(--font-display); letter-spacing: -0.02em; }
.page-head .lead { color: var(--text-2); margin-top: 6px; font-size: var(--fs-body); }
.page-head .actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }

/* ----- library ----- */
.resume {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 18px; align-items: center;
  padding: 16px 18px; border-radius: var(--r-l); background: var(--surface-2); border: 1px solid var(--line); position: relative; overflow: hidden;
}
.resume canvas { position: absolute; inset: auto 0 0 0; height: 46px; width: 100%; opacity: .55; pointer-events: none; }
.resume > * { position: relative; }
.resume h3 { font: 650 18px/1.2 var(--font-display); }
.resume .row { flex-wrap: wrap; }
.lib-tools { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.lib-tools .search { width: min(340px, 100%); }
.lib-tools .hint { margin-left: auto; color: var(--text-3); font-size: var(--fs-cap); display: flex; align-items: center; gap: 6px; }
.lib-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(258px, 1fr)); gap: 14px; }
.song {
  display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 14px; padding: 14px; border-radius: var(--r-l);
  background: var(--surface-2); border: 1px solid var(--line); position: relative; text-align: left; width: 100%;
  transition: border-color var(--t-fast), background var(--t-fast), transform var(--t-med) var(--ease);
}
.song:hover { border-color: var(--line-strong); background: color-mix(in srgb, var(--surface-2) 60%, var(--surface-3)); }
.song .cover { width: 64px; height: 64px; }
.song h3 { font-size: var(--fs-body); font-weight: 600; line-height: 1.35; }
.song .meta { color: var(--text-3); font-size: var(--fs-cap); margin-top: 2px; }
.song .stems { display: flex; gap: 4px; margin-top: 10px; align-items: center; }
.song .stems i { width: 14px; height: 4px; border-radius: 2px; background: var(--c); }
.song .foot { grid-column: 1 / -1; display: flex; align-items: center; gap: 6px; padding-top: 10px; border-top: 1px solid var(--line); }
.song .foot .chip { height: 22px; min-width: 0; flex: 0 1 auto; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.song .foot .chip:first-child { flex: none; }
.song .foot .card-actions { margin-left: auto; flex: none; display: flex; align-items: center; gap: 2px; }
.song .card-actions { margin-left: auto; display: flex; gap: 2px; }
.song .fav[aria-pressed="true"] { color: var(--warn); }
.song .open-hit { position: absolute; inset: 0; border-radius: inherit; }
.song .open-hit:focus-visible { outline-offset: -2px; }
.song .card-actions, .song .fav { position: relative; z-index: 1; }
.song.processing { border-color: var(--accent-line); }
.song .job { grid-column: 1 / -1; display: grid; gap: 6px; }
.song-list { display: grid; border: 1px solid var(--line); border-radius: var(--r-l); overflow: hidden; background: var(--surface-2); }
.song-list .lrow { display: grid; grid-template-columns: 40px minmax(0, 2.2fr) minmax(0, 1fr) 90px 120px 110px; gap: 14px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--line); text-align: left; width: 100%; }
.song-list .lrow:first-child { border-top: 0; }
.song-list .lrow.head { color: var(--text-3); font-size: var(--fs-cap); background: var(--surface-1); }
.song-list .lrow:not(.head):hover { background: var(--surface-3); }
.song-list .cover { width: 40px; height: 40px; border-radius: var(--r-s); }
.empty { display: grid; place-items: center; text-align: center; gap: 12px; padding: 56px 20px; border: 1.5px dashed var(--line-strong); border-radius: var(--r-l); color: var(--text-2); }
.empty h3 { font: 650 20px/1.2 var(--font-display); color: var(--text); }
.dropzone { position: absolute; inset: 12px; border: 2px dashed var(--accent); border-radius: var(--r-xl); background: color-mix(in srgb, var(--ground) 80%, var(--accent) 8%); display: grid; place-items: center; z-index: 30; pointer-events: none; text-align: center; gap: 8px; }
.dropzone b { font: 650 22px/1.2 var(--font-display); }

/* ----- menus / popovers ----- */
.menu { position: fixed; z-index: 80; min-width: 210px; padding: 6px; border-radius: var(--r-m); background: var(--surface-2); border: 1px solid var(--line-strong); box-shadow: var(--shadow-pop); display: grid; gap: 1px; animation: pop var(--t-med) var(--ease); }
.menu button { height: 32px; display: flex; align-items: center; gap: 9px; padding: 0 10px; border-radius: var(--r-s); text-align: left; color: var(--text); }
.menu button:hover { background: var(--surface-3); }
.menu button.danger { color: var(--danger); }
.menu .sep { height: 1px; background: var(--line); margin: 4px 2px; }
.menu .menu-label { font-size: var(--fs-micro); color: var(--text-3); padding: 6px 10px 2px; letter-spacing: .08em; }
.menu button .check-mark { margin-left: auto; color: var(--accent); }
@keyframes pop { from { opacity: 0; transform: translateY(-4px) scale(.98); } }

/* ----- sessions ----- */
.tbl { width: 100%; border-collapse: collapse; }
.tbl-wrap { border: 1px solid var(--line); border-radius: var(--r-l); overflow-x: auto; background: var(--surface-2); }
.tbl th { text-align: left; font-weight: 500; color: var(--text-3); font-size: var(--fs-cap); padding: 10px 14px; background: var(--surface-1); white-space: nowrap; }
.tbl td { padding: 12px 14px; border-top: 1px solid var(--line); vertical-align: middle; white-space: nowrap; }
.tbl tbody tr { cursor: pointer; transition: background var(--t-fast); }
.tbl tbody tr:hover { background: var(--surface-3); }
.kind { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-cap); color: var(--text-2); }
.kind .ico { color: var(--accent); }

/* ================= player ================= */
.player { height: 100%; display: grid; grid-template-rows: 64px 46px minmax(0, 1fr); min-width: 0; }
.ph { display: flex; align-items: center; gap: 12px; padding: 0 16px; border-bottom: 1px solid var(--line); background: var(--surface-1); min-width: 0; }
.ph .cover { width: 40px; height: 40px; border-radius: var(--r-s); }
.ph-title { min-width: 0; display: grid; gap: 2px; }
.ph-title h2 { font: 650 16px/1.2 var(--font-display); letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: text; }
.ph-meta { display: flex; align-items: center; gap: 4px; color: var(--text-2); font-size: var(--fs-cap); white-space: nowrap; }
.ph-meta button { padding: 1px 6px; border-radius: 5px; }
.ph-meta button:hover { background: var(--surface-3); color: var(--text); }
.ph-meta .sep { color: var(--text-3); }
.ph-right { margin-left: auto; display: flex; align-items: center; gap: 8px; flex: none; }
.saved { display: inline-flex; align-items: center; gap: 5px; font-size: var(--fs-cap); color: var(--text-3); }
.saved .ico { color: var(--ok); }
.ptool { display: flex; align-items: center; gap: 8px; padding: 0 16px; border-bottom: 1px solid var(--line); background: var(--surface-1); min-width: 0; overflow: hidden; }
.ptool .grow { display: flex; gap: 8px; align-items: center; min-width: 0; overflow: hidden; }
.loop-btn[data-state="armed"] { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-line); }
.loop-live { display: inline-flex; align-items: center; gap: 8px; height: 28px; padding: 0 6px 0 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: var(--fs-cap); font-weight: 500; white-space: nowrap; }
.loop-live .mono { color: var(--text-2); }
.pbody { display: grid; grid-template-columns: minmax(0, 1fr) 332px; min-height: 0; position: relative; }
.pbody.no-console { grid-template-columns: minmax(0, 1fr) 0; }
.stage { min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--ground); position: relative; }

/* waveform */
.wave-head { display: flex; align-items: center; gap: 10px; padding: 12px 18px 6px; min-width: 0; }
.wave-head .title { font-weight: 600; }
.wave-main { flex: 1; min-height: 200px; position: relative; margin: 0 18px; cursor: grab; touch-action: none; }
.wave-main.dragging { cursor: grabbing; }
.wave-main canvas, .lane canvas, .ov canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.wave-hint { text-align: center; color: var(--text-3); font-size: var(--fs-cap); padding: 6px 18px 10px; }
.lanes { display: grid; gap: 4px; padding: 8px 18px 6px; max-height: 46%; overflow-y: auto; flex: none; }
.lane { display: grid; grid-template-columns: 148px minmax(0, 1fr); align-items: stretch; height: 38px; border-radius: var(--r-s); background: var(--surface-1); border: 1px solid var(--line); overflow: hidden; transition: border-color var(--t-fast), opacity var(--t-fast); }
.lane[data-focus="true"] { border-color: var(--c); box-shadow: inset 3px 0 0 var(--c); }
.lane.off { opacity: .42; }
.lane-name { display: flex; align-items: center; gap: 8px; padding: 0 6px 0 10px; font-size: var(--fs-cap); min-width: 0; text-align: left; }
.lane-name:hover { background: var(--surface-3); }
.lane-wave { position: relative; cursor: pointer; }
.lane.take { background: color-mix(in srgb, var(--surface-1) 85%, var(--stem-take) 4%); }
.lane .ms { display: flex; gap: 2px; margin-left: auto; }
.ms-btn { width: 22px; height: 22px; border-radius: 5px; font: 700 10px/1 var(--font-mono); color: var(--text-3); border: 1px solid var(--line-strong); display: grid; place-items: center; }
.ms-btn:hover { color: var(--text); }
.ms-btn.s[aria-pressed="true"] { background: var(--warn); color: #1b1200; border-color: transparent; }
.ms-btn.m[aria-pressed="true"] { background: var(--danger); color: #fff; border-color: transparent; }

/* console */
.console { border-left: 1px solid var(--line); background: var(--surface-1); display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; overflow: hidden; }
.pbody.no-console .console { display: none; }
.console-tabs { padding: 10px 12px; border-bottom: 1px solid var(--line); }
.console-tabs .seg { width: 100%; }
.console-tabs .seg button { flex: 1; justify-content: center; }
.console-body { overflow-y: auto; padding: 4px 0 24px; }
.cs { padding: 14px 16px; border-bottom: 1px solid var(--line); display: grid; gap: 10px; }
.cs:last-child { border-bottom: 0; }
.cs-head { display: flex; align-items: center; gap: 8px; }
.cs-head h4 { margin: 0; font-size: var(--fs-cap); font-weight: 600; color: var(--text-2); letter-spacing: .02em; }
.cs-head .val { margin-left: auto; font: 500 var(--fs-cap)/1 var(--font-mono); color: var(--text); }
.picker { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--r-m); border: 1px solid var(--line-strong); background: var(--surface-2); text-align: left; width: 100%; }
.picker:hover { border-color: var(--text-3); }
.picker small { display: block; color: var(--text-3); font-size: var(--fs-micro); }
.picker b { display: block; font-size: var(--fs-cap); font-weight: 600; }
.strips { display: grid; }
.strip { display: grid; grid-template-columns: 4px minmax(0, 1fr); gap: 10px; padding: 10px 16px 10px 12px; border-bottom: 1px solid var(--line); position: relative; }
.strip:last-child { border-bottom: 0; }
.strip .meter { width: 4px; border-radius: 4px; background: var(--surface-3); position: relative; overflow: hidden; }
.strip .meter i { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: var(--c); border-radius: 4px; transition: height 60ms linear; }
.strip-top { display: flex; align-items: center; gap: 8px; min-width: 0; }
.strip-top .name { font-weight: 600; font-size: var(--fs-ui); min-width: 0; }
.strip-top .pct { margin-left: auto; font: 500 var(--fs-micro)/1 var(--font-mono); color: var(--text-3); }
.strip-ctl { display: grid; grid-template-columns: minmax(0, 1fr) 64px; gap: 12px; align-items: center; margin-top: 4px; }
.strip .pan-wrap { display: flex; align-items: center; gap: 3px; font: 500 9px/1 var(--font-mono); color: var(--text-3); }
.strip.off .name, .strip.off .range { opacity: .45; }
.tag-quiet { font-size: 10px; padding: 1px 6px; border-radius: 4px; color: var(--warn); background: color-mix(in srgb, var(--warn) 13%, transparent); white-space: nowrap; }
.strip.group { background: var(--surface-2); }
.strip .take-meta { font-size: var(--fs-micro); color: var(--text-3); }
.details-btn { font-size: var(--fs-cap); color: var(--text-2); display: inline-flex; align-items: center; gap: 4px; }
.details-btn:hover { color: var(--text); }
.nudge { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 6px; align-items: center; margin-top: 8px; padding: 8px; border-radius: var(--r-s); background: var(--surface-2); }
.big-val { font: 600 26px/1 var(--font-mono); letter-spacing: -0.03em; }
.stepper { display: grid; grid-template-columns: 34px minmax(0, 1fr) 34px; gap: 8px; align-items: center; }
.stepper .icon-btn { border: 1px solid var(--line-strong); }
.stepper .mid { text-align: center; }
.stepper .mid small { display: block; color: var(--text-3); font-size: var(--fs-micro); }
.opt { display: flex; align-items: center; gap: 10px; min-height: 30px; }
.opt .grow { display: grid; }
.opt small { color: var(--text-3); font-size: var(--fs-micro); line-height: 1.45; }
.presets { display: flex; gap: 4px; flex-wrap: wrap; }
.presets button { height: 24px; padding: 0 8px; border-radius: 6px; background: var(--surface-3); font: 500 11px/1 var(--font-mono); color: var(--text-2); }
.presets button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.mark-list { display: grid; gap: 4px; }
.mark { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 7px 8px; border-radius: var(--r-s); background: var(--surface-2); border: 1px solid var(--line); }
.mark.active { border-color: var(--accent-line); background: var(--accent-soft); }
.mark .mono { font-size: var(--fs-micro); color: var(--text-3); }
.mark b { font-weight: 500; font-size: var(--fs-ui); display: block; }
.mark .act { display: flex; }

/* transport */
.tp { border-top: 1px solid var(--line); background: var(--surface-1); display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 18px; align-items: center; padding: 10px 18px 12px; min-width: 0; }
.tp-left { display: flex; align-items: center; gap: 8px; }
.play {
  width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: var(--text); color: var(--ground);
  transition: transform var(--t-fast) var(--ease), box-shadow var(--t-med); flex: none;
}
.play:hover { transform: scale(1.05); box-shadow: 0 0 0 6px color-mix(in srgb, var(--text) 10%, transparent); }
.play .ico { width: 20px; height: 20px; }
.rec-btn { display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 14px 0 12px; border-radius: 999px; border: 1px solid color-mix(in srgb, var(--rec) 45%, transparent); color: var(--text); font-weight: 600; }
.rec-btn .rdot { width: 11px; height: 11px; border-radius: 50%; background: var(--rec); }
.rec-btn:hover { background: color-mix(in srgb, var(--rec) 12%, transparent); }
.rec-btn[data-state="rec"] { background: var(--rec); color: #fff; border-color: transparent; }
.rec-btn[data-state="rec"] .rdot { background: #fff; border-radius: 2px; animation: blink 1s steps(2) infinite; }
.rec-btn[data-state="count"] { background: color-mix(in srgb, var(--rec) 18%, transparent); }
@keyframes blink { 50% { opacity: .35; } }
.tp-mid { display: grid; gap: 4px; min-width: 0; }
.tp-mid .row { gap: 10px; }
.tp-time { font: 500 13px/1 var(--font-mono); color: var(--text); font-variant-numeric: tabular-nums; }
.tp-time.dim { color: var(--text-3); }
.ov { position: relative; height: 34px; cursor: pointer; border-radius: var(--r-s); overflow: hidden; touch-action: none; }
.tp-mode { font-size: var(--fs-micro); color: var(--text-3); display: flex; gap: 8px; align-items: center; }
.tp-mode b { color: var(--text-2); font-weight: 600; }
.tp-mode a, .linkish { color: var(--accent); cursor: pointer; text-decoration: none; }
.tp-right { display: flex; align-items: center; gap: 6px; }
.speed-chip { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 10px; border-radius: var(--r-s); background: var(--surface-3); font: 600 13px/1 var(--font-mono); }
.speed-chip:hover { background: var(--surface-4); }
.speed-chip.changed { color: var(--accent); background: var(--accent-soft); }

/* chords */
.chords { display: grid; grid-template-columns: minmax(0, 1fr) 270px; min-height: 0; height: 100%; }
.chart-wrap { overflow-y: auto; padding: 16px 20px 28px; min-width: 0; }
.chart-bar-top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
.chart-sec { margin-top: 14px; }
.chart-sec-name { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: var(--fs-cap); color: var(--text-2); font-weight: 600; }
.chart-sec-name .mono { color: var(--text-3); font-weight: 400; }
.chart-grid { display: grid; grid-template-columns: repeat(var(--per, 4), minmax(0, 1fr)); border-left: 2px solid var(--line-strong); }
.cbar { position: relative; min-height: 74px; border-right: 2px solid var(--line-strong); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); display: grid; grid-template-columns: repeat(var(--n, 1), minmax(0, 1fr)); transition: background var(--t-fast); }
.cbar .bn { position: absolute; top: 5px; left: 7px; font: 500 10px/1 var(--font-mono); color: var(--text-3); }
.cbar.now { background: var(--accent-soft); }
.cbar.now .bn { color: var(--accent); }
.cbar .prog { position: absolute; left: 0; bottom: 0; height: 2px; background: var(--accent); width: 0; }
.cslot { display: grid; place-items: center; font: 650 19px/1 var(--font-display); letter-spacing: -0.01em; padding: 16px 4px 8px; border-radius: 6px; margin: 3px; position: relative; color: var(--text); }
.cslot sup { font-size: .62em; font-weight: 600; }
.cslot:hover { background: var(--surface-3); }
.cslot.sel { box-shadow: inset 0 0 0 2px var(--accent); background: var(--accent-soft); }
.cslot.empty { color: var(--text-3); font: 400 var(--fs-cap)/1 var(--font-ui); }
.chord-side { border-left: 1px solid var(--line); background: var(--surface-1); padding: 16px; overflow-y: auto; display: grid; gap: 14px; align-content: start; }
.chord-lib { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.chord-lib button { height: 34px; border-radius: var(--r-s); background: var(--surface-3); font: 650 14px/1 var(--font-display); }
.chord-lib button:hover { background: var(--surface-4); }
.chord-lib button[draggable] { cursor: grab; }
.diagram { display: grid; place-items: center; padding: 10px; border-radius: var(--r-m); background: var(--surface-2); border: 1px solid var(--line); }
.diagram svg { width: 132px; height: 150px; }

/* score */
.score { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; }
.score-top { display: flex; gap: 8px; align-items: center; padding: 12px 18px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.score-body { display: grid; grid-template-columns: minmax(0, 1fr) 280px; min-height: 0; }
.score-sheet { overflow: auto; padding: 18px; }
.sheet-paper { background: var(--surface-2); border-radius: var(--r-m); border: 1px solid var(--line); padding: 18px 20px; min-width: 640px; }
.sheet-paper svg { width: 100%; height: auto; display: block; }
.conf { display: flex; height: 8px; border-radius: 4px; overflow: hidden; gap: 1px; }
.conf i { flex: 1; background: var(--ok); opacity: .7; }
.conf i.low { background: var(--warn); opacity: 1; }

/* attachments */
.attach { padding: 18px 20px; overflow-y: auto; height: 100%; display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 18px; align-content: start; }
.files { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.file { border-radius: var(--r-m); border: 1px solid var(--line); background: var(--surface-2); overflow: hidden; text-align: left; }
.file .thumb { height: 92px; background: var(--surface-3); display: grid; place-items: center; color: var(--text-3); }
.file .fmeta { padding: 8px 10px; font-size: var(--fs-cap); }
.file .fmeta small { color: var(--text-3); display: block; }
.file.add { border-style: dashed; display: grid; place-items: center; min-height: 140px; color: var(--text-2); gap: 6px; }

/* modal / drawer / toast */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 90; display: grid; place-items: center; padding: 24px; animation: fade var(--t-med); backdrop-filter: blur(2px); }
@keyframes fade { from { opacity: 0; } }
.modal { width: min(560px, 100%); max-height: min(760px, calc(100vh - 48px)); display: grid; grid-template-rows: auto minmax(0, 1fr) auto; border-radius: var(--r-l); background: var(--surface-2); border: 1px solid var(--line-strong); box-shadow: var(--shadow-pop); animation: rise var(--t-slow) var(--ease); overflow: hidden; }
.modal.wide { width: min(860px, 100%); }
@keyframes rise { from { opacity: 0; transform: translateY(10px) scale(.985); } }
.modal-head { display: flex; align-items: flex-start; gap: 12px; padding: 18px 20px 12px; }
.modal-head h3 { font: 650 18px/1.3 var(--font-display); }

function drawLane(cv, t, kind, id) {
  const { x, w, h } = fitCanvas(cv); x.clearRect(0, 0, w, h);
  const W = S.win, t0 = t - W / 2, mid = h / 2, pxT = tt => (tt - t0) / W * w;
  if (kind === 'track') {
    const tr = S.tracks.find(q => q.id === id); if (!tr) return; const color = COL.stem[tr.stem] || COL.text2, g = audible(tr) ? Math.max(.15, tr.vol) : .15;

    const p = session(); const tk = p && p.takes.find(q => q.id === id); if (!tk) return; const st = tk.start + tk.offsetMs / 1000, e = takeEnv(tk);

    for (let xx = Math.max(0, a); xx < Math.min(w, b); xx += 2) { const tt = t0 + xx / w * W - st; const v = envAt(e, tt) * tk.vol * (h / 2 - 3); x.fillStyle = alpha(COL.stem.take, xx < w / 2 ? .9 : .45); x.fillRect(xx, mid - v, 1.6, v * 2 + .5); }
    x.fillStyle = alpha(COL.stem.take, .9); x.fillRect(a, 2, 2, h - 4);

}
function drawOverview(cv, t) {
  const { x, w, h } = fitCanvas(cv); x.clearRect(0, 0, w, h); const D = dur();
  x.fillStyle = COL.s2; x.fillRect(0, 0, w, h);
  const mid = h / 2, step = 2, px = w * t / D;
  for (let xx = 0; xx < w; xx += step) {
    const a = xx / w * D, b = (xx + step) / w * D; let v = 0;
    for (const tr of S.tracks) v += envMax(ENV[tr.srcs[0]], a, b) * (audible(tr) ? tr.vol : 0) * .55;
    v = Math.min(1, v) * (h / 2 - 3);
    x.fillStyle = xx < px ? alpha(COL.accent, .9) : alpha(COL.text3, .55); x.fillRect(xx, mid - v, 1.4, v * 2 + 1);

  if (S.loop) { const a = S.loop[0] / D * w, b = S.loop[1] / D * w; x.fillStyle = alpha(COL.accent, .16); x.fillRect(a, 0, b - a, h); x.fillStyle = COL.accent; x.fillRect(a, 0, 1.5, h); x.fillRect(b - 1.5, 0, 1.5, h); }

}
function drawResume(cv) {

}
function prettyChord(c) { return String(c).replace('maj7', 'maj7').replace(/b(?=\d|$|m|5)/g, '♭').replace('#', '♯'); }
function chordHTML(c) { if (!c) return '<span>—</span>'; const m = /^([A-G][#b]?)(.*)$/.exec(c); if (!m) return esc(c); return esc(m[1].replace('b', '♭').replace('#', '♯')) + '<sup>' + esc(m[2].replace(/b5/, '♭5')) + '</sup>'; }

function cover(s, size = 64) {

function chordDiagram(name) {

/* ---------- player ---------- */

  const views = [['wave', 'wave', '波形'], ['chords', 'chords', '和弦'], ['score', 'score', '乐谱'], ['attach', 'paperclip', '附件']];
  const loopUI = S.loop ? `<span class="loop-live">${ic('repeat', 's')}<span>循环</span><span class="mono">${fmtMs(S.loop[0])} – ${fmtMs(S.loop[1])}</span><button class="toggle" role="switch" aria-checked="${S.loopOn}" data-act="loop-toggle" title="启用循环"></button><button class="icon-btn sm" data-act="loop-clear" title="清除循环">${ic('x', 's')}</button></span>`
    : `<button class="btn sm quiet loop-btn" data-act="loop-start" data-state="${S.loopArm != null ? 'armed' : ''}" title="设置循环段落开始（L）">${ic('loopStart', 's')}${S.loopArm != null ? `开始 ${fmtMs(S.loopArm)}` : '设置循环开始'}</button><button class="btn sm quiet" data-act="loop-end" ${S.loopArm == null ? 'disabled' : ''} title="设置循环段落结束（L）">${ic('loopEnd', 's')}设置循环结束</button>`;
  let stage = '';
  if (S.view === 'wave') stage = waveView();
  else if (S.view === 'chords') stage = chordsView();

  return `<div class="player">
    <div class="ph">
      ${cover(s, 40)}
      <div class="ph-title">${titleEl}
        <div class="ph-meta">${p ? `<span class="chip accent" style="height:20px">${p.kind === 'follow' ? '跟练' : '创作'}</span>` : ''}
          <button data-act="menu" data-kind="key" title="调性">${esc(s.key)}</button><span class="sep">·</span>
          <button data-act="menu" data-kind="tap" title="BPM · 点击 Tap 校准" class="mono">${s.bpm ? (Math.round(s.bpm * 10) / 10) + ' BPM' : '— BPM'}</button><span class="sep">·</span>
          <span class="mono">${fmt(s.dur)}</span>${!s.real ? `<span class="sep">·</span><span class="chip warn" style="height:20px">示例 · 无音频</span>` : ''}</div>
      </div>
      <div class="ph-right">
        <span class="saved">${ic('check', 's')}已保存</span>
        ${p ? '' : `<button class="picker hide-mid" style="width:auto" data-act="menu" data-kind="result" title="切换拆分结果">${ic('layers', 's')}<div><small>拆分结果</small><b>${esc(resLabel)}</b></div>${ic('chevDown', 's')}</button>`}
        ${p ? '' : `<button class="btn ${s.status === 'ready' ? '' : 'primary'}" data-act="analyze" data-id="${s.id}">${ic(s.status === 'ready' ? 'refresh' : 'split', 's')}${s.status === 'raw' ? '开始分析' : s.status === 'chords' ? '拆分音轨' : '重新拆分'}</button>`}
        <button class="btn" data-act="modal" data-kind="export">${ic('share', 's')}导出</button>

/* chords */
function chordsView() {
  const s = song(), list = S.charts[s.id] || [], ch = currentChart(), m = meta();
  if (!ch) return `<div class="empty" style="margin:24px">${ic('chords', 'l')}<h3>还没有和弦谱</h3><p>识别和弦与节拍只需要几十秒，不会拆分音轨。也可以从空白和弦谱开始自己写。</p><div class="row"><button class="btn primary" data-act="analyze" data-id="${s.id}" data-mode="chords">${ic('sparkles', 's')}识别和弦与节拍</button><button class="btn" data-act="chart-new">${ic('plus', 's')}新建空白和弦谱</button></div></div>`;
  const nowBar = Math.floor(S.t / m.bar);
  const secs = ch.sections.slice().sort((a, b) => a.bar - b.bar);
  const blocks = secs.map((sec, si) => {
    const end = secs[si + 1] ? secs[si + 1].bar : ch.bars.length;
    const bars = ch.bars.slice(sec.bar, end).map(b => `<div class="cbar ${b.i === nowBar ? 'now' : ''}" style="--n:${b.chords.length}" data-bar="${b.i}"><span class="bn">${b.i + 1}</span>${b.chords.map((c, j) => `<button class="cslot ${c ? '' : 'empty'} ${S.chordSel && S.chordSel.bar === b.i && S.chordSel.slot === j ? 'sel' : ''}" data-act="chord-slot" data-bar="${b.i}" data-slot="${j}" data-dblact="chord-seek">${c ? chordHTML(c) : '空'}</button>`).join('')}${b.i === nowBar ? '<i class="prog" data-live="barprog"></i>' : ''}</div>`).join('');
    return `<div class="chart-sec"><div class="chart-sec-name">${S.secEdit === si ? `<input class="input" style="height:26px;width:160px" id="sec-edit" data-in="sec-live" data-si="${si}" value="${esc(sec.name)}">` : `<button data-act="sec-edit" data-si="${si}" title="点击重命名段落">${esc(sec.name)}</button>`}<span class="mono">${fmt(sec.bar * m.bar)}</span><button class="btn sm ghost" data-act="loop-section" data-si="${si}" title="循环这一段">${ic('repeat', 's')}</button></div><div class="chart-grid" style="--per:${ch.perRow}">${bars}</div></div>`;
  }).join('');
  const sel = S.chordSel ? ch.bars[S.chordSel.bar].chords[S.chordSel.slot] : (ch.bars[nowBar] ? ch.bars[nowBar].chords[0] : 'Cm7');
  return `<div class="chords">
    <div class="chart-wrap" data-sk="chart">
      <div class="chart-bar-top">
        <button class="picker" style="width:auto" data-act="menu" data-kind="chart">${ic('chords', 's')}<div><small>${esc(ch.kind)} · ${list.length} 份和弦谱</small><b>${esc(ch.name)}</b></div>${ic('chevDown', 's')}</button>
        <label class="opt" style="min-height:0"><button class="toggle" role="switch" aria-checked="${S.chordFollow}" data-act="chord-follow"></button><span>跟随播放</span></label>
        <span class="grow"></span>
        <button class="btn sm ghost" data-act="chord-undo" ${S.undo.length ? '' : 'disabled'}>${ic('undo', 's')}撤销</button>
        <button class="btn sm ghost" data-act="chord-redetect">${ic('refresh', 's')}重新识别</button>
        <label class="row" style="gap:6px"><span class="label">每行小节数</span><select class="select" style="width:70px;height:28px" data-in="perRow">${[2, 4, 6, 8].map(n => `<option ${ch.perRow === n ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
        <button class="btn sm" data-act="menu" data-kind="barlines">${ic('sliders', 's')}小节线</button>
      </div>
      ${blocks}
      <p class="muted" style="margin-top:16px;font-size:var(--fs-cap)">单击格子选中 · 右侧点和弦替换 · 双击格子跳到该小节 · 每小节最多 2 个和弦</p>
    </div>
    <aside class="chord-side" data-sk="chordside">
      <div class="eyebrow">${S.chordSel ? `第 ${S.chordSel.bar + 1} 小节 · 第 ${S.chordSel.slot + 1} 个` : '当前小节'}</div>

function scoreSVG() {

  const r = rng(99); const low = new Set([5, 6, 10]);

    const y0 = row * rowH + 16;
    for (let i = 0; i < 5; i++) s += `<line x1="20" x2="${W - 20}" y1="${y0 + i * 7}" y2="${y0 + i * 7}" stroke="var(--text-3)" stroke-width=".8"/>`;
    for (let i = 0; i < 6; i++) s += `<line x1="20" x2="${W - 20}" y1="${y0 + 52 + i * 9}" y2="${y0 + 52 + i * 9}" stroke="var(--text-3)" stroke-width=".8"/>`;
    s += `<text x="24" y="${y0 + 72}" font-family="JetBrains Mono" font-size="11" fill="var(--text-2)">T</text><text x="24" y="${y0 + 84}" font-family="JetBrains Mono" font-size="11" fill="var(--text-2)">A</text><text x="24" y="${y0 + 96}" font-family="JetBrains Mono" font-size="11" fill="var(--text-2)">B</text>`;
    for (let b = 0; b < perRow; b++) {
      const bi = row * perRow + b, x0 = 20 + b * bw;
      if (low.has(bi)) s += `<rect x="${x0 + 1}" y="${y0 - 6}" width="${bw - 2}" height="110" rx="4" fill="var(--warn)" opacity=".12"/>`;
      s += `<rect data-sbar="${bi}" x="${x0 + 1}" y="${y0 - 6}" width="${bw - 2}" height="110" rx="4" fill="var(--accent)" opacity="0"/>`;
      s += `<line x1="${x0}" x2="${x0}" y1="${y0}" y2="${y0 + 97}" stroke="var(--text-2)" stroke-width="1"/>`;
      s += `<text x="${x0 + 4}" y="${y0 - 8}" font-family="JetBrains Mono" font-size="9" fill="var(--text-3)">${bi + 1}</text>`;
      const ch = currentChart(); const name = ch && ch.bars[bi] ? ch.bars[bi].chords[0] : ''; if (name) s += `<text x="${x0 + 22}" y="${y0 - 8}" font-family="Bricolage Grotesque" font-weight="650" font-size="12" fill="var(--text)">${esc(prettyChord(name))}</text>`;
      for (let n = 0; n < 8; n++) {

        s += `<rect x="${nx - 5}" y="${ny - 6}" width="11" height="11" fill="var(--surface-2)"/><text x="${nx}" y="${ny + 4}" text-anchor="middle" font-family="JetBrains Mono" font-size="10" fill="${low.has(bi) ? 'var(--warn)' : 'var(--text)'}">${fr}</text>`;

      }

  }
  return s + '</svg>';
}

<script>
'use strict';
/* =================== desktop overlays: modals · drawer · menus =================== */
MODES.push({ id: 'duo', name: '人声与伴奏', desc: '手机端可用 · 两轨', stems: ['vocals', 'other'], model: 'mobile', mobile: true });
const trackSetBase = trackSet;
trackSet = function (s, mode) {
  if ((mode || s.mode) === 'duo' && s.status === 'ready') return [mkTrack('vocals', ['vocals']), { ...mkTrack('other', ['drums', 'bass', 'piano', 'guitar', 'other']), name: '伴奏' }];
  return trackSetBase(s, mode);
};

function modalShell(head, sub, body, foot, cls = '') {
  return `<div class="scrim" data-act="modal-close" data-self="1"><div class="modal ${cls}" role="dialog" aria-modal="true" aria-label="${esc(head)}">
    <div class="modal-head"><div><h3>${head}</h3>${sub ? `<p>${sub}</p>` : ''}</div><button class="icon-btn" data-act="modal-close" title="关闭（Esc）">${ic('x')}</button></div>
    <div class="modal-body" data-sk="modal">${body}</div>${foot ? `<div class="modal-foot">${foot}</div>` : ''}</div></div>`;
}
function modeChoice(m, sel, model) {
  const need = model && model.state !== 'installed';
  return `<button class="choice" role="radio" aria-checked="${sel}" data-act="sep-mode" data-v="${m.id}">
    <span class="radio" aria-checked="${sel}"></span>
    <div><b>${esc(m.name)}${m.rec ? ' <span class="chip accent" style="height:18px;font-size:10px">推荐</span>' : ''}</b><small>${esc(m.desc)}</small>
      <div class="stems-inline">${m.stems.length ? m.stems.map(k => `<span class="mini-stem" style="--c:${STEMS[k].c}">${STEMS[k].name}</span>`).join('') : '<span class="mini-stem" style="--c:var(--text-3)">不拆分</span>'}</div></div>
    ${need ? `<span class="chip warn" style="height:20px" title="首次使用会自动下载">${ic('download', 's')}${esc(model.size.replace('约 ', ''))}</span>` : ''}</button>`;
}
function modalHTML() {
  const M = S.modal; if (!M) return '';
  const s = SONGS.find(x => x.id === M.id) || song();
  switch (M.kind) {
    case 'separate': {
      const md = MODES.find(m => m.id === M.mode) || MODES[2], model = S.models.find(x => x.id === md.model);
      const est = md.id === 'chords' ? '约 20 秒' : S.engine === 'nvidia' ? `约 ${Math.max(1, Math.round(s.dur * .2 / 60 * 10) / 10)} 分钟` : `约 ${Math.round(s.dur * 1.5 / 60)} 分钟`;
      return modalShell(`拆分「${esc(s.title)}」`, '在本机处理，不上传音频。拆完可以随时换一种方式重新拆，旧结果会保留。',
        `<div class="modes" role="radiogroup">${MODES.filter(m => !m.mobile).map(m => modeChoice(m, m.id === md.id, S.models.find(x => x.id === m.model))).join('')}</div>
        ${model && model.state !== 'installed' ? `<div class="notice warn">${ic('download', 's')}<span>需要先下载 <b style="color:var(--text)">${esc(model.name)}</b>（${esc(model.size)}），开始后会自动下载，下载源：${S.dlSource === 'auto' ? '自动选择最快' : S.dlSource === 'cn' ? '国内镜像' : '官方源'}。</span></div>` : ''}
        <div class="field"><span>处理方式</span><div class="seg">${[['nvidia', 'zap', 'NVIDIA 显卡'], ['cpu', 'cpu', 'CPU']].map(([k, i, n]) => `<button data-act="engine" data-v="${k}" aria-pressed="${S.engine === k}">${ic(i, 's')}${n}</button>`).join('')}</div></div>
        <label class="opt"><button class="check" role="checkbox" aria-checked="${M.chords !== false}" data-act="sep-chords"></button><span>同时识别和弦与节拍<small class="muted" style="display:block">用于智能节拍器、预备拍和和弦谱</small></span></label>`,
        `<span class="muted">${ic('clock', 's')} 预计 ${est}</span><button class="btn ghost" data-act="modal-close">取消</button><button class="btn primary" data-act="sep-start">${ic('split', 's')}开始${md.id === 'chords' ? '识别' : '拆分'}</button>`, 'wide');
    }
    case 'export': {
      const k = M.what || 'mix', f = M.fmt || 'wav';
      const what = [['mix', 'volume', '当前混音', '按现在的音量、静音、选听导出一个文件'], ['stems', 'layers', '各分轨单独导出', S.tracks.length + ' 个文件，放进同一个文件夹'], ['takes', 'mic', '录音与伴奏', '把挂载的录音和伴奏混在一起'], ['ijam', 'share', '工程包 .ijam', '分轨 + 和弦谱 + 标记点，发给朋友或手机']];
      return modalShell('导出', esc(song().title) + (S.loop ? ` · 可以只导出循环段落 ${fmt(S.loop[0])}–${fmt(S.loop[1])}` : ''),
        `<div class="stack" style="gap:8px" role="radiogroup">${what.filter(w => w[0] !== 'takes' || session()).map(([v, i, n, d]) => `<button class="choice" role="radio" aria-checked="${k === v}" data-act="exp-what" data-v="${v}">${ic(i)}<div><b>${n}</b><small>${d}</small></div><span class="radio" aria-checked="${k === v}"></span></button>`).join('')}</div>
        ${k !== 'ijam' ? `<div class="field"><span>格式</span><div class="seg">${['wav', 'flac', 'mp3'].map(x => `<button data-act="exp-fmt" data-v="${x}" aria-pressed="${f === x}">${x.toUpperCase()}</button>`).join('')}</div></div>

        <div class="row" style="gap:12px"><label class="field grow"><span>输入声道</span><div class="seg">${[['stereo', '立体声'], ['l', '仅左 · 输入 1'], ['r', '仅右 · 输入 2']].map(([v, n]) => `<button data-act="rs-ch" data-v="${v}" aria-pressed="${r.channel === v}">${n}</button>`).join('')}</div></label></div>

        <div class="card" style="padding:14px"><div class="row"><div class="grow"><b>延迟校正 · <span class="mono">${r.latency} ms</span></b><small class="muted" style="display:block">录音会自动往前挪这么多，和伴奏对齐。换声卡或蓝牙耳机后要重新校准。</small></div><button class="btn" data-act="modal" data-kind="calib">${ic('target', 's')}校准</button></div></div>`,

      else if (st === 1) body = `<div class="calib-stage"><div class="big mono">${i}/8</div><div class="calib-dots">${Array.from({ length: 8 }, (_, k) => `<i class="${k < i ? 'on' : k === i ? 'now' : ''}"></i>`).join('')}</div><p class="dim">正在测量… 请保持安静</p></div>`;
      else body = `<div class="calib-stage"><span class="chip ok">${ic('check', 's')}测量完成 · 8/8 有效</span><div class="big mono">31 ms</div></div>

      return modalShell('延迟校准', '让录音和伴奏严丝合缝。', body,
        st === 0 ? `<button class="btn ghost" data-act="modal" data-kind="recSettings">返回</button><button class="btn primary" data-act="calib-go">${ic('play', 's')}开始测量</button>`
          : st === 1 ? `<button class="btn ghost" data-act="calib-cancel">取消</button>`
            : `<button class="btn ghost" data-act="calib-go">重新测量</button><button class="btn primary" data-act="calib-apply">${ic('check', 's')}使用 31 ms</button>`);

    case 'confirm':
      return modalShell(esc(M.title), esc(M.body), '', `<button class="btn ghost" data-act="modal-close">取消</button><button class="btn danger" data-act="confirm-yes">${ic('trash', 's')}${esc(M.ok || '删除')}</button>`);
    case 'recovery':
      return modalShell('上次没有正常退出', 'Immerse Jam 找到了 2 条还没保存好的录音，要恢复吗？',
        `<div class="checklist">${[['Fabulous · 吉他跟练', '录音 4 · 0:42 · 10-31 23:58'], ['test2', '混音录音 2 · 1:15 · 10-31 23:40']].map(([a, b]) => `<button data-act="noop"><span class="check" role="checkbox" aria-checked="true"></span>${ic('mic', 's')}<div><b style="font-weight:600">${a}</b><small class="muted" style="display:block">${b}</small></div><span></span></button>`).join('')}</div>`,
        `<button class="btn danger-ghost" data-act="recover-no">丢弃</button><button class="btn primary" data-act="recover-yes">${ic('rotate', 's')}恢复 2 条录音</button>`);
    case 'incoming':
      return modalShell('Pixel 8 想发给你 1 个项目', '来自同一网络 · 192.168.31.57 · 已配对',
        `<div class="checklist"><button data-act="noop"><span></span>${cover({ id: 's-in', hue: 40 }, 32)}<div><b style="font-weight:600">Lemon 吉他跟练.ijam</b><small class="muted" style="display:block">2 轨伴奏 · 3 条录音 · 和弦谱 · 46 MB</small></div><span class="chip">工程包</span></button></div>
        ${M.p != null ? `<div class="stack" style="gap:6px"><div class="row between"><span class="dim">${M.p >= 1 ? '已收到，已放进曲库' : '正在接收…'}</span><span class="mono muted">${Math.round(M.p * 100)}%</span></div><div class="progress ${M.p >= 1 ? 'ok' : ''}"><i style="--p:${M.p * 100}%"></i></div></div>` : ''}`,
        M.p == null ? `<button class="btn ghost" data-act="modal-close">拒绝</button><button class="btn primary" data-act="incoming-accept">${ic('download', 's')}接收</button>` : M.p >= 1 ? `<button class="btn primary" data-act="modal-close">完成</button>` : `<button class="btn ghost" data-act="modal-close">取消</button>`);
    case 'onboard': {
      const st = M.step || 0;
      const steps = [['upload', '把歌拖进来', '支持 mp3 / flac / wav，也可以直接拖视频。导入后不会改动原文件。'], ['split', '拆成分轨', '选一种拆分方式，在本机拆出人声、鼓、贝斯、吉他……第一次会自动下载模型。'], ['headphones', '开始练', '关掉你要练的声部、拖波形定位、设循环、降速，再按 R 录下自己。']];
      const [i, t, d] = steps[st];
      return modalShell('欢迎使用 Immerse Jam', '三步上手，30 秒看完。',
        `<div class="onb"><div class="onb-art">${ic(i, 'l')}</div><div class="eyebrow">第 ${st + 1} 步 / 共 3 步</div><h3 style="font:650 20px/1.3 var(--font-display)">${t}</h3><p class="dim" style="line-height:1.7">${d}</p><div class="onb-dots">${steps.map((_, k) => `<i class="${k === st ? 'on' : ''}"></i>`).join('')}</div></div>`,
        `<button class="btn ghost" data-act="modal-close">跳过</button>${st ? `<button class="btn" data-act="onb" data-v="${st - 1}">上一步</button>` : ''}${st < 2 ? `<button class="btn primary" data-act="onb" data-v="${st + 1}">下一步</button>` : `<button class="btn primary" data-act="onb-done">${ic('upload', 's')}导入第一首歌</button>`}`);
    }
    case 'folder':
      return modalShell(M.rename ? '重命名文件夹' : '新建分类文件夹', '文件夹只用来整理，一首歌可以随时移动。',
        `<label class="field"><span>名称</span><input class="input" id="folder-name" data-in="folder-name" data-enter="folder-save" value="${esc(M.name || '')}" placeholder="例如：乐队排练"></label>`,
        `<button class="btn ghost" data-act="modal-close">取消</button><button class="btn primary" data-act="folder-save" ${(M.name || '').trim() ? '' : 'disabled'}>保存</button>`);
    case 'donate':
      return modalShell('请作者喝一瓶冰可乐', 'Immerse Jam 免费、离线可用。你的支持会变成更快的模型和更多的功能。',
        `<div class="row" style="gap:20px;align-items:flex-start;flex-wrap:wrap"><div class="qr" style="width:150px;height:150px"><canvas data-cv="qr" data-seed="77" width="29" height="29" style="width:126px;height:126px"></canvas></div>
        <div class="stack grow" style="min-width:200px"><div class="seg"><button aria-pressed="true">微信</button><button>支付宝</button><button>爱发电</button></div><p class="dim" style="line-height:1.7">扫码即可。不支持也完全没关系，<br>多练几首歌就是最好的反馈 🎸</p></div></div>`,
        `<button class="btn primary" data-act="modal-close">好的</button>`);
  }
  return '';
}

/* ---------- drawer: takes library / trash ---------- */
function drawerHTML() {
  if (!S.drawer) return '';
  const p = session();
  if (S.drawer === 'trash') {
    return `<div class="drawer-scrim" data-act="drawer-close"></div><aside class="drawer" aria-label="录音回收站">
      <div class="modal-head"><div><h3>录音回收站</h3><p>删除的录音保留 30 天，之后自动清除。</p></div><button class="icon-btn" data-act="drawer-close">${ic('x')}</button></div><div></div>
      <div data-sk="drawer" style="overflow:auto">${S.trash.length ? S.trash.map(tk => `<div class="take"><span class="stem-dot" style="--c:var(--text-3)"></span><div style="min-width:0"><b class="ellipsis" style="display:block">${esc(tk.name)}</b><small>${esc(tk.from)} · ${fmt(tk.dur)} · 还剩 ${tk.days} 天</small><div class="mini"><canvas data-cv="mini" data-id="${tk.id}"></canvas></div></div><div class="row"><button class="btn sm" data-act="trash-restore" data-id="${tk.id}">${ic('undo', 's')}恢复</button><button class="icon-btn sm" data-act="trash-del" data-id="${tk.id}" title="永久删除">${ic('trash', 's')}</button></div></div>`).join('') : `<div class="empty" style="margin:16px">${ic('trash', 'l')}<h3>回收站是空的</h3></div>`}</div>
      <div class="modal-foot">${S.trash.length ? `<button class="btn danger-ghost" data-act="trash-empty">清空回收站</button>` : ''}</div></aside>`;
  }
  if (!p) return '';
  const mounted = p.takes.filter(t => t.mounted).length;
  return `<div class="drawer-scrim" data-act="drawer-close"></div><aside class="drawer" aria-label="录音库">
    <div class="modal-head"><div><h3>录音库 · ${esc(p.name)}</h3><p>已挂载 ${mounted}/2 条，挂载的录音会和伴奏一起播放。</p></div><button class="icon-btn" data-act="drawer-close">${ic('x')}</button></div>
    <div style="padding:0 20px 10px"><div class="seg sm"><button aria-pressed="true">全部 ${p.takes.length}</button><button data-act="drawer" data-v="trash">回收站 ${S.trash.length}</button></div></div>
    <div data-sk="drawer" style="overflow:auto">${p.takes.length ? p.takes.slice().reverse().map(tk => `<div class="take">
      <button class="check" role="checkbox" aria-checked="${tk.mounted}" data-act="take-mount" data-id="${tk.id}" title="${tk.mounted ? '取消挂载' : '挂载到项目'}"></button>
      <div style="min-width:0">${S.takeRename === tk.id ? `<input class="input" style="height:28px" id="take-name" data-in="take-name" data-enter="take-name-save" data-id="${tk.id}" value="${esc(tk.name)}">` : `<b class="ellipsis" style="display:block" data-dbl="take-rename" data-id="${tk.id}" title="双击重命名">${esc(tk.name)}</b>`}<small>${esc(tk.when)} · 从 ${fmt(tk.start)} 开始 · ${fmt(tk.dur)}${tk.offsetMs ? ` · 微调 ${tk.offsetMs > 0 ? '+' : ''}${tk.offsetMs} ms` : ''}</small><div class="mini"><canvas data-cv="mini" data-id="${tk.id}"></canvas></div></div>
      <div class="row"><button class="icon-btn sm" data-act="take-preview" data-id="${tk.id}" title="从这条录音开始的位置播放">${ic('play', 's')}</button><button class="icon-btn sm" data-act="take-trash" data-id="${tk.id}" title="移到回收站">${ic('trash', 's')}</button></div></div>`).join('') : `<div class="empty" style="margin:16px">${ic('mic', 'l')}<h3>还没有录音</h3><p>按 <span class="kbd">R</span> 开始第一条。</p></div>`}</div>
    <div class="modal-foot"><span class="muted">${ic('info', 's')} 挂满 2 条后，新录音会自动放进这里</span><button class="btn" data-act="drawer" data-v="trash">${ic('trash', 's')}回收站</button></div></aside>`;
}

/* ---------- menus ---------- */
function mItem(act, icon, label, attrs = '', checked = false, cls = '') { return `<button class="${cls}" data-act="${act}" ${attrs}>${icon ? ic(icon, 's') : '<span style="width:15px"></span>'}<span class="grow ellipsis">${label}</span>${checked ? `<span class="check-mark">${ic('check', 's')}</span>` : ''}</button>`; }
function menuHTML() {
  const M = S.menu; if (!M) return '';
  let h = '';
  const s = song();
  switch (M.kind) {
    case 'scenes': h = `<div class="menu-label">演示场景</div>${mItem('scene', 'inbox', '空曲库', 'data-v="empty"')}${mItem('scene', 'help', '第一次使用（新手引导）', 'data-v="first"')}${mItem('scene', 'rotate', '恢复意外退出的录音', 'data-v="recovery"')}${mItem('scene', 'download', '收到手机发来的文件', 'data-v="incoming"')}${mItem('scene', 'refresh', '有新版本', 'data-v="update"')}${mItem('scene', 'split', '正在拆分一首歌', 'data-v="job"')}<div class="sep"></div>${mItem('scene', 'undo', '恢复默认数据', 'data-v="restore"')}`; break;
    case 'card': {
      const c = SONGS.find(x => x.id === M.id); if (!c) break;
      h = `${mItem('open-song', 'play', '打开', `data-id="${c.id}"`)}${mItem('analyze', 'split', c.status === 'ready' ? '重新拆分…' : '开始分析…', `data-id="${c.id}"`)}${mItem('new-session', 'mic', '用这首歌跟练', `data-id="${c.id}"`)}${mItem('fav', 'star', c.fav ? '取消收藏' : '收藏', `data-id="${c.id}"`)}
        <div class="sep"></div><div class="menu-label">移动到文件夹</div>${mItem('move-folder', 'inbox', '不放进文件夹', `data-id="${c.id}" data-v=""`, !c.folder)}${FOLDERS.map(f => mItem('move-folder', 'folder', esc(f.name), `data-id="${c.id}" data-v="${f.id}"`, c.folder === f.id)).join('')}${mItem('modal', 'folderPlus', '新建文件夹…', 'data-kind="folder"')}
        <div class="sep"></div>${mItem('toast', 'folder', '在资源管理器中显示', 'data-msg="打开文件所在位置（原型）"')}${mItem('ask-delete', 'trash', '从曲库删除…', `data-what="song" data-id="${c.id}"`, false, 'danger')}`; break;
    }
    case 'import': h = `${mItem('fake-import', 'music', '音频或视频文件…')}${mItem('fake-import', 'folder', '整个文件夹…', 'data-v="folder"')}<div class="sep"></div>${mItem('toast', 'file', 'Audio Jam 曲目（.aum）…', 'data-msg="选择 .aum 文件（原型）"')}${mItem('toast', 'share', '工程包（.ijam）…', 'data-msg="选择 .ijam 工程包（原型）"')}<div class="sep"></div>${mItem('nav', 'transfer', '从手机接收…', 'data-v="transfer"')}`; break;
    case 'key': {
      const ks = [s.key, transposeKey(s.key, 7), transposeKey(s.key, 5), transposeKey(s.key, 3)];
      h = `<div class="menu-label">识别结果 · 可信度 92%</div>${ks.map((k, i) => mItem('set-key', i ? '' : 'sparkles', esc(k) + (i ? '' : ' · 识别'), `data-v="${esc(k)}"`, s.key === k)).join('')}<div class="sep"></div>${mItem('ctab', 'sliders', '变调与修正调性…', 'data-v="practice"')}`; break;
    }
    case 'tap': {
      const bpm = tapBpm();
      h = `<div class="menu-label">BPM · Tap 校准</div><div class="menu-body"><div class="row between"><span class="dim">识别</span><b class="mono">${s.bpm ? Math.round(s.bpm * 10) / 10 : '—'}</b></div>
        <button class="tap-pad" data-act="tap" data-keep="1">${bpm ? bpm.toFixed(1) + ' BPM' : '跟着节拍点这里'}</button>
        <small class="muted">${S.tap.length < 4 ? `再点 ${4 - S.tap.length} 次以上` : `已点 ${S.tap.length} 次`} · 也可以用键盘 <span class="kbd">T</span></small>
        <div class="row"><button class="btn sm ghost grow" data-act="tap-x2" data-keep="1" ${bpm ? '' : 'disabled'}>×2</button><button class="btn sm ghost grow" data-act="tap-half" data-keep="1" ${bpm ? '' : 'disabled'}>÷2</button><button class="btn sm primary grow" data-act="tap-apply" ${bpm ? '' : 'disabled'}>使用</button></div></div>`; break;
    }
    case 'result': {
      const md = MODES.find(m => m.id === s.mode);
      h = `<div class="menu-label">这首歌的拆分结果</div>${mItem('noop', 'layers', `${esc(md ? md.name : '—')} · ${esc((S.models.find(m => m.id === (md && md.model)) || {}).name || '')}`, '', true)}${mItem('toast', 'layers', '基础四轨 · HT Demucs · 10-30', 'data-msg="已切换到「基础四轨」结果（原型）"')}<div class="sep"></div>${mItem('analyze', 'plus', '用另一种方式拆分…', `data-id="${s.id}"`)}`; break;
    }

/* ---------- player ---------- */
