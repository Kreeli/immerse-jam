  return `<div class="lane ${off ? 'off' : ''}" style="--c:${STEMS[tr.stem].c}"><button class="lane-name" data-act="mute" data-id="${tr.id}" aria-pressed="${tr.mute}" aria-label="${esc(tr.name)}${tr.mute ? '（已关闭）' : ''}"><span class="stem-dot" style="--c:${STEMS[tr.stem].c}"></span><span class="ellipsis">${esc(tr.name)}</span>${ic(tr.mute ? 'volumeX' : tr.solo ? 'headphones' : 'volume', 's')}</button>
    <div class="lane-wave"><canvas data-cv="lane" data-kind="track" data-id="${tr.id}"></canvas></div></div>`;
}
function mPlayer() {
  const s = song(), p = session();
  const rs = S.rec.state === 'rec' ? 'rec' : S.rec.state === 'count' ? 'count' : '';
  const mounted = p ? p.takes.filter(t => t.mounted) : [];
  let body;
  if (S.mview === 'chords') body = mChords();
  else body = `<div class="m-wave">
      <div class="m-wave-head"><b>${S.focus ? '单轨' : '混音'}</b><span class="muted" style="font-size:12px">${s.status === 'raw' ? '还没有拆分' : '关掉的声部会从波形里消失'}</span><span class="grow"></span>${!s.real ? '<span class="chip warn" style="height:20px;font-size:11px">示例 · 无音频</span>' : ''}</div>
      <div class="wave-main" data-drag="wave" aria-label="波形，左右拖动定位"><canvas data-cv="main"></canvas>
        ${S.counting ? `<div class="count-overlay"><div><b>${S.counting.i}</b><small>预备拍 ${S.counting.i} / ${S.counting.n}</small></div></div>` : ''}
        ${S.rec.state === 'rec' ? `<div class="rec-banner"><i></i>录音中 · <span class="mono" data-live="rec-time">0:00</span></div>` : ''}</div>
      <div class="m-scroll" data-sk="m-lanes" style="max-height:290px">
        <div class="m-chips">
          ${S.loop ? `<button class="btn sm ${S.loopOn ? 'on' : ''}" data-act="loop-toggle">${ic('repeat', 's')}${fmt(S.loop[0])}–${fmt(S.loop[1])}</button><button class="btn sm" data-act="loop-clear" aria-label="清除循环">${ic('x', 's')}</button>`
        : `<button class="btn sm ${S.loopArm != null ? 'armed' : ''}" data-act="${S.loopArm != null ? 'loop-end' : 'loop-start'}">${ic(S.loopArm != null ? 'loopEnd' : 'loopStart', 's')}${S.loopArm != null ? '设循环结束' : '设循环开始'}</button>`}
          <button class="btn sm" data-act="add-marker">${ic('flag', 's')}标记</button>
          <button class="btn sm" data-act="msheet" data-kind="console" data-tab="mix">${ic('sliders', 's')}控制台</button>
          ${p ? `<button class="btn sm" data-act="msheet" data-kind="takes">${ic('inbox', 's')}录音 ${p.takes.length}</button>` : ''}
          <button class="btn sm ${S.metro ? 'on' : ''}" data-act="metro">${ic('metronome', 's')}节拍器</button>
        </div>
        ${s.status === 'raw' ? `<div style="padding:0 12px 10px"><div class="notice">${ic('info', 's')}<span class="grow">拆分后可以单独关掉人声、只听伴奏。</span><button class="btn sm primary" data-act="msheet" data-kind="analyze" data-id="${s.id}">分析</button></div></div>` : ''}
        <div class="m-lanes">${S.tracks.map(mLane).join('')}${mounted.map(tk => `<div class="lane take ${tk.mute ? 'off' : ''}" style="--c:var(--stem-take)"><button class="lane-name" data-act="take-mute" data-id="${tk.id}"><span class="stem-dot" style="--c:var(--stem-take)"></span><span class="ellipsis">${esc(tk.name)}</span>${ic(tk.mute ? 'volumeX' : 'volume', 's')}</button><div class="lane-wave"><canvas data-cv="lane" data-kind="take" data-id="${tk.id}"></canvas></div></div>`).join('')}</div>
      </div></div>`;
  return `<div class="m-player">
    <div class="m-top"><button class="icon-btn back" data-act="mback" aria-label="返回">${ic('arrowLeft')}</button>
      <div class="titles"><h1>${esc(p ? p.name : s.title)}</h1><small>${esc(s.key)} · ${s.bpm ? Math.round(s.bpm) + ' BPM' : '— BPM'}${p ? ' · ' + (p.kind === 'follow' ? '跟练' : '创作') : ''}</small></div>
      <button class="icon-btn" data-act="msheet" data-kind="song" data-id="${s.id}" aria-label="更多">${ic('moreV')}</button></div>
    <div class="m-views"><div class="seg" role="tablist">${[['wave', 'wave', '波形'], ['chords', 'chords', '和弦谱']].map(([k, i, n]) => `<button role="tab" data-act="mview" data-v="${k}" aria-selected="${S.mview === k}">${ic(i, 's')}${n}</button>`).join('')}</div></div>
    ${body}
    <div class="m-dock">
      <div class="ov" data-drag="ov"><canvas data-cv="ov"></canvas></div>
      <div class="times"><b data-live="time">${fmtMs(S.t)}</b><span data-live="bar">第 1 小节</span><span>${fmt(s.dur)}</span></div>
      <div class="m-dock-row">
        <button class="m-speed ${S.speed !== 1 ? 'changed' : ''}" data-act="msheet" data-kind="speed" aria-label="播放速度">${S.speed.toFixed(2).replace(/0$/, '')}×</button>
        <button class="icon-btn" data-act="back5" aria-label="后退 5 秒">${ic('back5')}</button>
        <button class="play" data-act="play" aria-label="${S.playing ? '暂停' : '播放'}">${ic(S.playing || S.counting ? 'pause' : 'play')}</button>
        <button class="icon-btn" data-act="fwd5" aria-label="前进 5 秒">${ic('fwd5')}</button>
        <button class="m-rec" data-act="rec" data-state="${rs}" aria-label="${rs === 'rec' ? '停止录音' : '练琴录音'}"><i></i></button>
      </div></div>
  </div>`;
}
function mChords() {
  const s = song(), ch = currentChart(), m = meta(), list = S.charts[s.id] || [];
  if (!ch) return `<div class="m-chords"><div class="m-empty">${ic('chords')}<b>还没有和弦谱</b><span>识别和弦与节拍只要几十秒，不会拆分音轨。</span><button class="btn primary" data-act="m-analyze-chords" data-id="${s.id}">${ic('sparkles', 's')}识别和弦与节拍</button><button class="btn" data-act="chart-new">${ic('plus', 's')}空白和弦谱</button></div></div>`;
  const nowBar = Math.floor(S.t / m.bar);
  const secs = ch.sections.slice().sort((a, b) => a.bar - b.bar);
  return `<div style="display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0">
    <div class="m-chord-top"><button class="chip" data-act="m-chart-next">${ic('chords', 's')}${esc(ch.name)}${list.length > 1 ? ` · ${S.chartIdx + 1}/${list.length}` : ''}</button><span class="grow"></span><label class="row" style="gap:8px;font-size:13px">跟随播放<button class="toggle" role="switch" aria-checked="${S.chordFollow}" data-act="chord-follow"></button></label></div>
    <div class="m-chords" data-sk="m-chart">${secs.map((sec, si) => {
    const end = secs[si + 1] ? secs[si + 1].bar : ch.bars.length;
    return `<div class="chart-sec"><div class="chart-sec-name"><span style="font-weight:600">${esc(sec.name)}</span><span class="mono">${fmt(sec.bar * m.bar)}</span><button class="btn sm ghost" data-act="loop-section" data-si="${si}" aria-label="循环这一段">${ic('repeat', 's')}</button></div>
      <div class="chart-grid">${ch.bars.slice(sec.bar, end).map(b => `<div class="cbar ${b.i === nowBar ? 'now' : ''}" style="--n:${b.chords.length}" data-bar="${b.i}"><span class="bn">${b.i + 1}</span>${b.chords.map((c, j) => `<button class="cslot ${c ? '' : 'empty'} ${S.chordSel && S.chordSel.bar === b.i && S.chordSel.slot === j ? 'sel' : ''}" data-act="mchord-slot" data-bar="${b.i}" data-slot="${j}">${c ? chordHTML(c) : '空'}</button>`).join('')}${b.i === nowBar ? '<i class="prog" data-live="barprog"></i>' : ''}</div>`).join('')}</div></div>`;
  }).join('')}</div></div>`;
}

/* ---------- bottom sheets ---------- */
function sheetHead(title, sub) { return `<div class="grab" data-act="sheet-close"><i></i></div><div class="sheet-head"><div style="min-width:0"><h3>${title}</h3>${sub ? `<p>${sub}</p>` : ''}</div><button class="icon-btn" data-act="sheet-close" aria-label="关闭">${ic('x')}</button></div>`; }
function mSheet() {
  const sh = S.sheet; if (!sh) return '';
  let inner = '', h = sh.full ? '88%' : '62%';
  const s = SONGS.find(x => x.id === sh.id) || song();
  switch (sh.kind) {
    case 'console': {
      const tab = sh.tab || 'mix';
      const tabs = [['mix', '控制台'], ['loop', '循环段落'], ['marks', '标记点']];
      let body = '';
      if (tab === 'mix') {
        body = `<div class="cs"><div class="cs-head"><h4>总音量</h4><span class="val" data-out="master">${pct(S.master)}</span></div>${rangeEl('master', S.master, 0, 1, .01, 'var(--text-2)', 'aria-label="总音量"')}</div>
          <div class="strips">${S.tracks.map(t => stripHTML(t)).join('')}</div>
          ${session() ? `<div class="section-label">${ic('mic', 's')}录音 · 已挂载 ${session().takes.filter(t => t.mounted).length}/2</div><div class="strips">${session().takes.filter(t => t.mounted).map(t => stripHTML(t, true)).join('')}</div>` : ''}
          <div class="cs"><div class="opt"><div class="grow"><span>智能节拍器</span><small>跟着识别出的节拍走</small></div><button class="toggle" role="switch" aria-checked="${S.metro}" data-act="metro"></button></div>
            <div class="opt"><div class="grow"><span>预备拍 · ${S.countIn.beats} 拍</span><small>播放和录音前先数拍</small></div><button class="toggle" role="switch" aria-checked="${S.countIn.on}" data-act="countin"></button></div></div>`;
      } else if (tab === 'loop') {
        const m = meta(), ch = currentChart();
        body = `<div class="sheet-pad">${S.loop ? `<div class="mark active"><span class="mono">${fmtMs(S.loop[0])}</span><b>到 ${fmtMs(S.loop[1])} · ${(S.loop[1] - S.loop[0]).toFixed(1)} 秒</b><button class="toggle" role="switch" aria-checked="${S.loopOn}" data-act="loop-toggle"></button></div><button class="btn block" data-act="loop-clear">${ic('x', 's')}清除循环</button>`
          : `<div class="row"><button class="btn grow ${S.loopArm != null ? '' : 'primary'}" data-act="loop-start">${ic('loopStart', 's')}${S.loopArm != null ? `开始 ${fmtMs(S.loopArm)}` : '在这里开始'}</button><button class="btn grow ${S.loopArm != null ? 'primary' : ''}" data-act="loop-end" ${S.loopArm == null ? 'disabled' : ''}>${ic('loopEnd', 's')}在这里结束</button></div>`}
          <div class="m-sec-title">按段落循环</div><div class="chips-wrap">${(ch ? ch.sections : m.sections).map((sec, i) => `<button class="btn sm" data-act="loop-section" data-si="${i}">${ic('repeat', 's')}${esc(sec.name)}</button>`).join('')}</div></div>`;
      } else {
        body = `<div class="sheet-pad"><button class="btn primary block" data-act="add-marker">${ic('flag', 's')}在 ${fmtMs(S.t)} 添加标记点</button>
          <div class="mark-list">${S.markers.slice().sort((a, b) => a.t - b.t).map(mk => `<div class="mark"><span class="mono">${fmtMs(mk.t)}</span><button style="text-align:left;min-height:36px" data-act="marker-go" data-id="${mk.id}"><b class="ellipsis">${esc(mk.name)}</b></button><span class="act"><button class="icon-btn" data-act="marker-loop" data-id="${mk.id}" aria-label="从这里循环">${ic('repeat', 's')}</button><button class="icon-btn" data-act="marker-del" data-id="${mk.id}" aria-label="删除">${ic('trash', 's')}</button></span></div>`).join('') || '<p class="muted">还没有标记点。</p>'}</div></div>`;
      }

    case 'import':
      h = 'auto';
      inner = `${sheetHead('导入歌曲', '导入后不会改动原文件')}<div class="sheet-body"><div class="sheet-pad"><div class="m-list">

        <button data-act="m-import" data-v="record">${ic('mic')}<div><span>现场录一段</span><small>用手机麦克风录下排练或演出</small></div><span class="val">${ic('chevRight', 's')}</span></button></div></div></div>`;

        <div class="modes" role="radiogroup">${[['duo', '人声与伴奏', '两轨 · 约 1–2 分钟', ['vocals', 'other']], ['chords', '识别和弦与节拍', '不拆分 · 约 20 秒', []]].map(([k, n, d, st]) => `<button class="choice" role="radio" aria-checked="${mode === k}" data-act="m-an-mode" data-v="${k}"><span class="radio" aria-checked="${mode === k}"></span><div><b>${n}</b><small>${d}</small><div class="stems-inline">${st.length ? st.map(x => `<span class="mini-stem" style="--c:${STEMS[x].c}">${x === 'other' ? '伴奏' : STEMS[x].name}</span>`).join('') : '<span class="mini-stem" style="--c:var(--text-3)">BPM · 小节线 · 和弦</span>'}</div></div></button>`).join('')}</div>

</script>
<script>
'use strict';
/* =================== runtime: render · live update · drawing · jobs · recording =================== */
let rendering = false, lastSig = '', pointerDown = false, pendingRender = false;
(() => {
  const st = document.createElement('style');

})();
const isNarrow = () => innerWidth < 760;
const effDevice = () => (isNarrow() ? 'mobile' : S.device);
const hasSong = () => SONGS.length > 0;

function applyTheme() {
  const r = document.documentElement;

}

function render() {
  if (pointerDown) { pendingRender = true; return; }
  pendingRender = false;
  applyTheme();
  document.body.classList.toggle('narrow', isNarrow());
  const dev = effDevice();
  document.body.classList.toggle('mobile', dev === 'mobile');
  const app = $('#app');
  const sk = {};
  $$('[data-sk]', app).forEach(el => { sk[el.dataset.sk] = [el.scrollTop, el.scrollLeft]; });
  const ae = document.activeElement;
  let foc = null;
  if (ae && app.contains(ae) && (ae.id || (ae.dataset && ae.dataset.in))) foc = { id: ae.id, din: ae.dataset.in, did: ae.dataset.id, s: ae.selectionStart, e: ae.selectionEnd };
  const sig = [S.modal && S.modal.kind, S.drawer, S.menu && S.menu.kind + (S.menu.id || ''), S.sheet && S.sheet.kind, dev, S.route, S.mroute, S.consoleOpen].join('|');
  document.body.classList.toggle('calm', sig === lastSig);
  lastSig = sig;
  rendering = true;
  const sd = S.device; S.device = dev;
  $('#proto-tools').innerHTML = protoTools();
  S.device = sd;
  app.innerHTML = dev === 'mobile' ? (S.mspec ? specPage(true) : mobile()) : desktop();
  rendering = false;
  $$('[data-sk]', app).forEach(el => { const v = sk[el.dataset.sk]; if (v) { el.scrollTop = v[0]; el.scrollLeft = v[1]; } });
  if (S._focusNext) {
    const el = $('#' + S._focusNext); S._focusNext = null;
    if (el) { el.focus(); el.select && el.select(); }
  } else if (foc) {
    const el = foc.id ? $('#' + CSS.escape(foc.id)) : $(`[data-in="${foc.din}"]${foc.did ? `[data-id="${foc.did}"]` : ''}`, app);
    if (el) { el.focus({ preventScroll: true }); try { if (foc.s != null) el.setSelectionRange(foc.s, foc.e); } catch (e) {} }
  }
  const mn = $('.menu', app);
  if (mn && S.menu) {
    const r = mn.getBoundingClientRect();
    if (r.right > innerWidth - 8) mn.style.left = Math.max(8, innerWidth - r.width - 8) + 'px';
    if (r.bottom > innerHeight - 8) mn.style.top = Math.max(8, (S.menu.ty || innerHeight) - r.height - 6) + 'px';

}
const renderLight = () => render();

/* ---------- live (per-frame) updates without re-rendering ---------- */
function setOut(key, txt) { $$(`[data-out="${key}"]`).forEach(o => { o.textContent = txt; }); }
function liveUpdate() {
  if (!hasSong() || rendering) return;
  const t = S.t, m = meta(), bar = Math.floor(t / m.bar);
  $$('[data-live="time"]').forEach(el => { el.textContent = fmtMs(t); });
  $$('[data-live="bar"]').forEach(el => { el.textContent = `第 ${bar + 1} 小节`; });
  if (S.rec.state === 'rec') $$('[data-live="rec-time"]').forEach(el => { el.textContent = fmt(t - S.rec.start); });
  $$('canvas[data-cv="main"]').forEach(cv => drawMain(cv, t));
  $$('canvas[data-cv="lane"]').forEach(cv => (cv.dataset.kind === 'live' ? drawLive(cv, t) : drawLane(cv, t, cv.dataset.kind, cv.dataset.id)));
  $$('canvas[data-cv="ov"]').forEach(cv => drawOverview(cv, t));
  const p = session();
  $$('[data-meter]').forEach(el => {
    let v = 0;
    if (S.playing) {
      if (el.dataset.meter === 'track') { const tr = S.tracks.find(x => x.id === el.dataset.id); if (tr) v = trackVal(tr, t) * visGain(tr); }
      else { const tk = p && p.takes.find(x => x.id === el.dataset.id); if (tk && audible(tk)) v = envAt(takeEnv(tk), t - tk.start - tk.offsetMs / 1000) * tk.vol; }
    }
    el.style.height = clamp(v * 100, 0, 100) + '%';
  });
  const cur = $$('.cbar.now'), target = $$(`.cbar[data-bar="${bar}"]`);
  if (target.length && cur[0] !== target[0]) {
    cur.forEach(c => { c.classList.remove('now'); const pr = c.querySelector('.prog'); pr && pr.remove(); });
    target.forEach(c => {
      c.classList.add('now');
      if (!c.querySelector('.prog')) { const i = document.createElement('i'); i.className = 'prog'; i.dataset.live = 'barprog'; c.appendChild(i); }
      if (S.chordFollow && S.playing) c.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    });
  }
  $$('.cbar.now .prog').forEach(pr => { pr.style.width = ((t % m.bar) / m.bar * 100) + '%'; });
}

function drawLive(cv, t) {
  const { x, w, h } = fitCanvas(cv); x.clearRect(0, 0, w, h);
  if (S.rec.state !== 'rec') return;
  const W = S.win, t0 = t - W / 2, mid = h / 2, a = Math.max(0, (S.rec.start - t0) / W * w);
  x.fillStyle = alpha(COL.rec, .1); x.fillRect(a, 2, Math.max(0, w / 2 - a), h - 4);
  for (let xx = a; xx < w / 2; xx += 2) {
    const v = envAt(S.rec.env, t0 + xx / w * W - S.rec.start) * (h / 2 - 3);
    x.fillStyle = alpha(COL.rec, .9); x.fillRect(xx, mid - v, 1.6, v * 2 + .5);
  }

}
function findTake(id) {
  for (const p of SESSIONS) { const tk = p.takes.find(q => q.id === id); if (tk) return tk; }
  return S.trash.find(q => q.id === id) || null;
}
function drawQR(cv) {
  const N = 29, x = cv.getContext('2d');

  const r = rng(+(cv.dataset.seed || 0) || (S.pair.exp % 99991) || 7);
  x.fillStyle = '#ffffff'; x.fillRect(0, 0, N, N); x.fillStyle = '#111014';
  const inF = (i, j) => (i < 8 && j < 8) || (i > N - 9 && j < 8) || (i < 8 && j > N - 9);
  for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) if (!inF(i, j) && r() < .47) x.fillRect(i, j, 1, 1);
  const finder = (ox, oy) => { for (let i = 0; i < 7; i++) for (let j = 0; j < 7; j++) { const ring = i === 0 || j === 0 || i === 6 || j === 6, core = i >= 2 && i <= 4 && j >= 2 && j <= 4; if (ring || core) x.fillRect(ox + i, oy + j, 1, 1); } };
  finder(0, 0); finder(N - 7, 0); finder(0, N - 7);
}
function drawAll() {
  $$('canvas[data-cv="mini"]').forEach(cv => { const tk = findTake(cv.dataset.id); if (tk) drawMini(cv, tk); });
  $$('canvas[data-cv="resume"]').forEach(cv => drawResume(cv));
  $$('canvas[data-cv="qr"]').forEach(cv => drawQR(cv));
}

/* ---------- toasts ---------- */
function toast(msg, icon = 'check', action) {
  const id = nid('toast-');
  S.toasts.push({ id, msg, icon, action });
  if (S.toasts.length > 3) S.toasts.shift();
  renderToasts();
  setTimeout(() => { S.toasts = S.toasts.filter(t => t.id !== id); renderToasts(); }, action ? 5200 : 2800);
}
function renderToasts() {
  $('#toasts').innerHTML = S.toasts.map(t => `<div class="toast" role="status">${ic(t.icon, 's')}<span class="grow">${esc(t.msg)}</span>${t.action ? `<button data-act="toast-do" data-id="${t.id}">${esc(t.action.label)}</button>` : ''}</div>`).join('');
}

/* ---------- background jobs (split / chords / model / update / transfer) ---------- */
function startJob(songId, mode, chords) {
  const md = MODES.find(m => m.id === mode) || MODES[2];
  const model = S.models.find(x => x.id === md.model);
  const phases = [];
  if (model && model.state !== 'installed') phases.push(['dl', `下载模型 ${model.name}`, .06]);
  if (mode !== 'chords') phases.push(['split', `拆分中 · ${md.name}`, mode === 'duo' ? .035 : .028]);
  if (mode === 'chords' || chords) phases.push(['chords', '识别和弦与节拍', .09]);
  S.jobs[songId] = { phases, i: 0, q: 0, p: 0, label: phases[0][1], mode, chords, model: model && model.id };
}
function advanceJob(id, j) {
  const ph = j.phases[j.i];
  j.q += ph[2];
  if (j.q >= 1) {
    if (ph[0] === 'dl') { const m = S.models.find(x => x.id === j.model); if (m) m.state = 'installed'; }
    j.i++; j.q = 0;
    if (j.i >= j.phases.length) { finishJob(id, j); return; }
  }
  j.label = j.phases.length > 1 ? `${j.phases[j.i][1]}（${j.i + 1}/${j.phases.length}）` : j.phases[j.i][1];

}

  if (!s.bpm) s.bpm = 100;
  if (s.key === '—') s.key = 'C 大调';
  if (j.mode === 'chords' || j.chords) { const l = S.charts[id] || (S.charts[id] = []); if (!l.some(c => c.kind === '识别')) l.unshift(buildChart(s, 'auto')); }
  if (S.songId === id) { S.tracks = trackSet(s); applyMix(); }
  toast(`「${s.title}」${j.mode === 'chords' ? '和弦与节拍识别完成' : '拆分完成'}`, 'check', { label: '打开', fn: () => openSong(id) });
}
function finishIncoming() {
  if (SONGS.some(x => x.id === 's-lemon')) return;
  const s = { id: 's-lemon', title: 'Lemon', artist: '米津玄師 · 来自 Pixel 8', dur: 255, bpm: 87, key: 'B 大调', status: 'ready', mode: 'duo', fav: false, folder: null, hue: 48, added: '11-03' };
  SONGS.unshift(s);
  S.charts[s.id] = [buildChart(s, 'auto')];
  const takes = [mkTake('录音 1', 12, 30, 61, true), mkTake('录音 2', 48, 26, 67, false), mkTake('录音 3', 80, 34, 73, false)];
  takes.forEach(t => { t.when = '11-02'; });
  SESSIONS.unshift({ id: 'p-lemon', kind: 'follow', name: 'Lemon 吉他跟练', song: 's-lemon', mode: 'stems', updated: '刚刚', takes });
  toast('已收到「Lemon 吉他跟练」', 'download', { label: '打开', fn: () => openSession('p-lemon') });
}
function tick() {
  let dirty = false;
  for (const [id, j] of Object.entries(S.jobs)) {
    dirty = true;
    if (id === 'migrate') {
      j.p = Math.min(1, j.p + .025);
      j.label = `正在迁移 ${Math.max(1, Math.ceil(j.p * j.n))}/${j.n} 首 · 分轨和标记点一起带过来`;
      if (j.p >= 1) { delete S.jobs.migrate; toast(`已迁移 ${j.n} 首歌到曲库`, 'check', { label: '查看', fn: () => { S.route = 'library'; S.libFilter = 'all'; } }); }
      continue;
    }
    if (j.phases) advanceJob(id, j);
  }
  S.models.forEach(m => {
    if (m.state === 'dl') { dirty = true; m.p += .035; if (m.p >= 1) { m.state = 'verify'; m.p = 0; } }
    else if (m.state === 'verify') { dirty = true; m.p += .12; if (m.p >= 1) { m.state = 'installed'; m.p = 0; toast(`${m.name} 已下载并校验`); } }
  });

  $$('[data-live="inlevel"]').forEach(el => { el.style.setProperty('--p', (18 + Math.random() * 46).toFixed(0) + '%'); });

}

/* ---------- transport frame loop ---------- */
function frame() {
  if (S.playing && hasSong()) {
    let t = clockNow();
    if (realAudio() && performance.now() - AE.lastSync > 800) {
      AE.lastSync = performance.now();
      const el = AE.els.vocals;
      if (el && !el.paused && Math.abs(el.currentTime - t) > .25) { AE.clockT = el.currentTime; AE.clockStart = performance.now(); t = el.currentTime; }
    }
    if (S.loop && S.loopOn && t >= S.loop[1]) {
      const wasRec = S.rec.state === 'rec';
      if (wasRec) stopRec();

      if (wasRec) render();
    } else if (t >= dur() - .05) {
      pause(); S.t = Math.max(0, dur() - .05);

    }
    S.t = t;
    if (S.metro) {
      const m = meta(), b = Math.floor(t / m.beat);
      if (b !== S.lastBeat) { if (S.lastBeat !== -1) click(b % (m.beatsPerBar || 4) === 0); S.lastBeat = b; }
    }
    if (S.rec.state === 'rec') {
      const e = S.rec.env, i = Math.floor((t - S.rec.start) * BINS);
      while (e.length <= i) { const k = e.length; e.push(clamp((.22 + .55 * Math.abs(Math.sin(k * .37)) * (.55 + Math.random() * .45)) * (k % 24 < 17 ? 1 : .3), 0, 1)); }
    }
    liveUpdate();
  }
  requestAnimationFrame(frame);
}

/* ---------- recording ---------- */
function startRec() {
  if (!hasSong()) return;
  if (S.rec.state === 'rec') { stopRec(); render(); return; }
  if (S.rec.state === 'count' || S.counting) { clearCount(); S.rec = { state: 'idle' }; render(); return; }
  const p = session();
  if (!p) {
    if (effDevice() === 'mobile') {
      if (!SONGS.some(x => x.status === 'ready')) { toast('先拆分一首歌，再在伴奏上录音', 'info'); return; }
      S.sheet = { kind: 'newSession', src: song().status === 'ready' ? song().id : null };
      toast('先建一个跟练项目，录音会保存在里面', 'info');
    } else S.modal = { kind: 'newSession', src: S.songId, thenRec: true };
    render(); return;
  }
  audioInit();
  if (S.playing) { beginRec(); render(); return; }
  if (S.countIn.on) {
    S.rec = { state: 'count' };
    startCountIn(() => { beginRec(); S._skipCount = true; play(); S._skipCount = false; });
    render(); return;
  }
  beginRec(); S._skipCount = true; play(); S._skipCount = false;
}
function beginRec() { S.rec = { state: 'rec', start: S.t, env: [] }; }
function stopRec() {
  const r = S.rec; if (r.state !== 'rec') return;
  S.rec = { state: 'idle' };

    case 'speed': { const t = clockNow(); S.speed = n; S.t = t; startClock(); setOut('speed', n.toFixed(2) + '×'); break; }

    case 'take-pan': { const t = findSessTake(id); if (t) t.pan = n; break; }

    setRange(k, n, id);

  }
  switch (k) {
    case 'q': S.q = v; render(); break;
    case 'rename-live': if (committed) commitRename(v); break;

    case 'take-name': if (committed) commitTakeName(v, id); break;

      break;
    case 'scoreTrack': S.scoreTrack = v; break;
    case 'pairNet': S.pair.net = v; if (committed) toast(`已切换到 ${v}`, 'wifi'); break;
    case 'peerCode': S.pair.code = v; break;
    case 'mcode': S.mcode = v; render(); break;
    case 'ns-name': if (S.modal) S.modal.name = v; break;
    case 'ns-src': if (S.modal) { S.modal.src = v; render(); } break;

  const el = e.target.closest('[data-drag]');
  if (!el || e.button !== 0 || !hasSong()) return;
  drag = { kind: el.dataset.drag, el, x0: e.clientX, t0: S.t, moved: false };
  if (drag.kind === 'ov') ovSeek(e);
  try { el.setPointerCapture(e.pointerId); } catch (err) {}
});
document.addEventListener('pointermove', e => {
  if (!drag) return;
  if (drag.kind === 'wave') {
    const dx = e.clientX - drag.x0;
    if (!drag.moved && Math.abs(dx) < 4) return;
    if (!drag.moved) { drag.moved = true; drag.el.classList.add('dragging'); }
    seek(drag.t0 - dx / drag.el.getBoundingClientRect().width * S.win);
  } else ovSeek(e);
});
function endPointer() {
  if (drag) { drag.el.classList.remove('dragging'); drag = null; }
  pointerDown = false;
  if (pendingRender) setTimeout(() => { if (!pointerDown && pendingRender) render(); }, 0);
}
document.addEventListener('pointerup', endPointer);
document.addEventListener('pointercancel', endPointer);
document.addEventListener('wheel', e => {
  const w = e.target.closest('.wave-main'); if (!w || !hasSong()) return;
  e.preventDefault();
  if (e.ctrlKey) {
    const Z = [4, 8, 16, 30]; let i = Z.indexOf(S.win); if (i < 0) i = 1;
    S.win = Z[clamp(i + (e.deltaY > 0 ? 1 : -1), 0, Z.length - 1)]; render();
  } else seek(S.t + (e.deltaY + e.deltaX) / 600 * S.win);
}, { passive: false });

/* ---------- file drop ---------- */
document.addEventListener('dragover', e => {
  if (!e.dataTransfer || !Array.from(e.dataTransfer.types || []).includes('Files')) return;
  e.preventDefault();
  const zone = e.target.closest('[data-drop]');
  if (!!zone !== S.drop) { S.drop = !!zone; render(); }
});
document.addEventListener('dragleave', e => { if (S.drop && !e.relatedTarget) { S.drop = false; render(); } });
document.addEventListener('drop', e => {
  if (!e.dataTransfer || !e.dataTransfer.files.length) return;
  e.preventDefault();
  const zone = e.target.closest('[data-drop]'); S.drop = false;
  if (!zone) { render(); return; }
  const names = Array.from(e.dataTransfer.files).filter(f => /^(audio|video)\//.test(f.type) || /\.(mp3|flac|wav|m4a|ogg|mp4|mov|mkv)$/i.test(f.name)).map(f => f.name.replace(/\.[^.]+$/, ''));
  if (!names.length) { toast('只支持音频或视频文件', 'alert'); render(); return; }
  fakeImport(names); render();
});
